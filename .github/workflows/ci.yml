name: CI

# Default behavior, on every push to master and every pull request: build the
# static site, test its link previews, and (on master) publish it to GitHub
# Pages. That is all that runs by default, because the full
# example/test/type/lint suite is already run on the local machine before
# pushing, and GitHub Actions can be slow.
#
# The full gates (examples match the Markdown, every example runs clean, pytest
# passes, ty-clean, ruff-clean) are opt-in, as are the prose checks (codespell
# spelling and Vale house style). Run them only when you want a second opinion
# in CI, in either of two ways:
#   * From the Actions tab, choose this workflow and click "Run workflow"
#     (the "run_gates" input defaults to true), or run
#       gh workflow run ci.yml -f run_gates=true
#   * Include the marker [full-ci] anywhere in a push commit message.
#
# Chapter 44's four Effect programs (Koka, Flix, ZIO, TypeScript Effect)
# have a job of their own, "effects", on a separate switch: the
# "run_effects" input (default false) or the marker [effects-ci] in a push
# commit message. It installs four toolchains, so it stays off the default
# path; locally, `tip effects-all` does the same with whatever is installed.
#
# Tooling is managed by uv.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_gates:
        description: "Run the full gates plus the spelling/house-style checks"
        type: boolean
        default: true
      run_effects:
        description: "Build and run chapter 44's Koka, Flix, ZIO, and TypeScript programs"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Default work: build the static site and test its link previews. Fast,
  # because it skips running the examples, type-checking, and linting. On a
  # push to master it hands the built site to the deploy job below.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install tooling
        run: uv sync --locked

      - name: Build the static site
        run: uv run python -m tools.build_site

      # Hovers and taps the built pages' links under jsdom (`tip
      # preview-check` locally). The previews depend on the HTML this
      # runner's pandoc writes, which is not the pandoc that built the site
      # locally, so this is the one check that has to run here: a link into
      # the book with no panel fails the job, and the deploy with it. Node
      # is on the runner image; the script installs its pinned jsdom under
      # build/node/, outside the build/site that gets uploaded.
      - name: Test the link previews
        run: node tools/site_preview_check.js

      # On master only, hand the built site to the deploy job below.
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  # The full gates, opt-in only (manual dispatch with run_gates=true, or a push
  # commit message containing [full-ci]). These run on the local machine on
  # every change, so they are not part of the default CI path.
  gates:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_gates) ||
      (github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[full-ci]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install tooling
        run: uv sync --locked

      # Hard gate: the book's code blocks must match the committed Examples/
      # tree (no drift, no conflicting duplicates).
      - name: Check examples match the Markdown
        run: uv run python -m tools.extract_examples

      - name: Extract examples for running
        run: uv run python -m tools.extract_examples --write

      # Hard gate: every extracted example must run cleanly (the book is fully
      # modernized, so the baseline is empty; use --baseline to gate only
      # regressions during future bulk work).
      - name: Run examples
        run: uv run python -m tools.run_examples

      # Hard gate: the book's pytest examples (test_*.py) must pass.
      - name: Run the book's pytest examples
        run: uv run pytest build/examples

      # Hard gate: the examples must stay ty-clean (zero diagnostics).
      - name: Type-check examples with ty
        run: uv run ty check build/examples

      # Hard gate: PEP 8 lint (naming, imports, modernization) must pass.
      # See pyproject [tool.ruff]; deliberate exceptions live in
      # per-file-ignores.
      - name: Lint examples with ruff
        run: uv run ruff check build/examples

      # The same five checks, applied to Solutions/ (worked exercise
      # answers), which go through a parallel extract/validate/ty/ruff/pytest
      # pipeline (tools/extract_solutions.py). See tools/README.md.
      - name: Check solutions match Solutions/*/README.md
        run: uv run python -m tools.extract_solutions

      - name: Extract solutions for running
        run: uv run python -m tools.extract_solutions --write

      - name: Verify solutions #: output markers
        run: uv run python -m tools.validate_output --tree "$GITHUB_WORKSPACE/build/solutions" Solutions

      - name: Type-check solutions with ty
        run: uv run ty check build/solutions

      - name: Lint solutions with ruff
        run: uv run ruff check build/solutions

      - name: Run the solutions' pytest examples
        run: uv run pytest build/solutions

  # Prose checks, opt-in only (same trigger as the gates job). codespell fails
  # on spelling errors; Vale fails on em-dashes (an error-level rule) and prints
  # the warning-level house-style findings. These also run locally via
  # `tip spell` and `tip prose`.
  prose:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_gates) ||
      (github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[full-ci]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.15"
          enable-cache: true

      # Spelling: codespell is a uv-managed dev tool. Config lives in
      # pyproject [tool.codespell]; the ignore list in tools/data/codespell-ignore.txt.
      - name: Install tooling
        run: uv sync --locked

      - name: Spell-check prose with codespell
        run: uv run codespell Chapters

      # Vale is a standalone binary, not a Python package. Install the latest
      # release; pin "version" below if you want fully reproducible runs.
      - name: Install Vale
        run: |
          version=$(curl -fsSL https://api.github.com/repos/errata-ai/vale/releases/latest | grep -oP '"tag_name": "v\K[^"]+')
          curl -fsSL "https://github.com/errata-ai/vale/releases/download/v${version}/vale_${version}_Linux_64-bit.tar.gz" | sudo tar -xz -C /usr/local/bin vale
          vale --version

      # Download the third-party styles referenced in .vale.ini (write-good,
      # proselint). They are not committed, so CI fetches them each run.
      - name: Sync Vale packages
        run: vale sync

      # House style: fails on em-dashes (error level); filler findings are
      # warnings and do not fail the job. Config in .vale.ini.
      - name: House-style lint with Vale
        run: vale Chapters

  # Chapter 44's greeting program in four other languages, each built and
  # run with its own toolchain and held to one expected transcript
  # (effects/README.md). Opt-in on its own switch, since four toolchains
  # take minutes to install and the programs change only with chapter 44.
  # The gate's own read of effects/ (drift against the Markdown) needs no
  # toolchain and is part of `tip check` in the gates job above.
  effects:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_effects) ||
      (github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[effects-ci]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Install tooling
        run: uv sync --locked

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install scala-cli
        uses: VirtusLab/scala-cli-setup@v1

      # The install script at a release's own URL pins that release.
      - name: Install Koka
        run: |
          curl -sSL https://github.com/koka-lang/koka/releases/download/v3.2.9/install.sh | sh -s -- --quiet
          koka --version --console=raw

      # flix.jar at the pinned version, and npm ci against the lockfile.
      - name: Fetch the Flix compiler and the TypeScript packages
        run: uv run tip effects-fetch

      # REQUIRE=1: with every toolchain installed, a skip is a failure.
      - name: Build and run the four programs
        run: uv run tip effects-test REQUIRE=1

  # Publishes the site to GitHub Pages (bruceeckel.github.io/ThinkingInPython)
  # on a push to master. It depends only on the site build, not on the opt-in
  # gates, so publishing is not blocked by them.
  deploy:
    needs: site
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
