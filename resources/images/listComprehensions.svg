<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 388"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>The list comprehension [e ** 2 for e in a_list if isinstance(e, int)] with its parts numbered by the order Python evaluates them, a_list first, then for each element the variable, the predicate, and last the output expression, and a table that runs a_list = [1, "4", 9, "a", 0, 4] through those steps to give [1, 81, 0, 16]</title>
  <defs>
    <marker id="lc-muted" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#7a6e62" stroke="#7a6e62" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="32" y="97" font-size="36" fill="#1a1612" text-anchor="start">[</text>
  <text x="674" y="97" font-size="36" fill="#1a1612" text-anchor="start">]</text>
  <rect x="60" y="64" width="90" height="42" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="105" y="91" font-size="17" fill="#1a1612" font-weight="bold" text-anchor="middle">e ** 2</text>
  <rect x="166" y="64" width="190" height="42" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="184" y="91" font-size="17" fill="#1a1612" font-weight="bold" text-anchor="start">for e in a_list</text>
  <rect x="372" y="64" width="290" height="42" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="409.9" y="91" font-size="17" fill="#1a1612" font-weight="bold" text-anchor="start">if isinstance(e, int)</text>
  <text x="64.8" y="24" font-size="18" fill="#8b1a1a" font-weight="bold" text-anchor="start">4</text>
  <text x="82.8" y="22" font-size="12" fill="#1a1612" font-weight="bold" text-anchor="start">Output Expression</text>
  <line x1="105" y1="28" x2="105.0" y2="47.6" stroke="#7a6e62" stroke-width="1.3" marker-end="url(#lc-muted)"/>
  <text x="247" y="24" font-size="18" fill="#8b1a1a" font-weight="bold" text-anchor="start">1</text>
  <text x="265" y="22" font-size="12" fill="#1a1612" font-weight="bold" text-anchor="start">Input Sequence</text>
  <line x1="306.4" y1="28" x2="306.4" y2="47.6" stroke="#7a6e62" stroke-width="1.3" marker-end="url(#lc-muted)"/>
  <line x1="229.9" y1="132" x2="229.9" y2="122.4" stroke="#7a6e62" stroke-width="1.3" marker-end="url(#lc-muted)"/>
  <text x="192.1" y="150" font-size="18" fill="#8b1a1a" font-weight="bold" text-anchor="start">2</text>
  <text x="210.1" y="148" font-size="12" fill="#1a1612" font-weight="bold" text-anchor="start">Variable</text>
  <line x1="376" y1="112" x2="376" y2="117" stroke="#7a6e62" stroke-width="1.2"/>
  <line x1="658" y1="112" x2="658" y2="117" stroke="#7a6e62" stroke-width="1.2"/>
  <line x1="376" y1="117" x2="658" y2="117" stroke="#7a6e62" stroke-width="1.2"/>
  <line x1="517" y1="117" x2="517" y2="132" stroke="#7a6e62" stroke-width="1.2"/>
  <text x="443.2" y="150" font-size="18" fill="#8b1a1a" font-weight="bold" text-anchor="start">3</text>
  <text x="461.2" y="148" font-size="12" fill="#1a1612" font-weight="bold" text-anchor="start">Optional Predicate</text>
  <line x1="24" y1="160" x2="696" y2="160" stroke="#c8bfb0" stroke-width="0.8"/>
  <text x="24" y="198" font-size="18" fill="#8b1a1a" font-weight="bold" text-anchor="start">1</text>
  <text x="42" y="196" font-size="12" fill="#1a1612" text-anchor="start">a_list, once</text>
  <rect x="228" y="176" width="68" height="30" fill="none" stroke="#1a1612" stroke-width="1.1" rx="4"/>
  <text x="262" y="196" font-size="13" fill="#1a1612" text-anchor="middle">1</text>
  <rect x="308" y="176" width="68" height="30" fill="none" stroke="#1a1612" stroke-width="1.1" rx="4"/>
  <text x="342" y="196" font-size="13" fill="#1a1612" text-anchor="middle">"4"</text>
  <rect x="388" y="176" width="68" height="30" fill="none" stroke="#1a1612" stroke-width="1.1" rx="4"/>
  <text x="422" y="196" font-size="13" fill="#1a1612" text-anchor="middle">9</text>
  <rect x="468" y="176" width="68" height="30" fill="none" stroke="#1a1612" stroke-width="1.1" rx="4"/>
  <text x="502" y="196" font-size="13" fill="#1a1612" text-anchor="middle">"a"</text>
  <rect x="548" y="176" width="68" height="30" fill="none" stroke="#1a1612" stroke-width="1.1" rx="4"/>
  <text x="582" y="196" font-size="13" fill="#1a1612" text-anchor="middle">0</text>
  <rect x="628" y="176" width="68" height="30" fill="none" stroke="#1a1612" stroke-width="1.1" rx="4"/>
  <text x="662" y="196" font-size="13" fill="#1a1612" text-anchor="middle">4</text>
  <text x="24" y="230" font-size="11" fill="#7a6e62" text-anchor="start">then per element, left to right:</text>
  <path d="M312,240 H372 Q376,240 376,244 V332 Q376,336 372,336 H312 Q308,336 308,332 V244 Q308,240 312,240 Z" fill="#eeeeee" stroke="none" stroke-width="1.6"/>
  <path d="M472,240 H532 Q536,240 536,244 V332 Q536,336 532,336 H472 Q468,336 468,332 V244 Q468,240 472,240 Z" fill="#eeeeee" stroke="none" stroke-width="1.6"/>
  <text x="24" y="260" font-size="18" fill="#8b1a1a" font-weight="bold" text-anchor="start">2</text>
  <text x="42" y="258" font-size="12" fill="#1a1612" text-anchor="start">e =</text>
  <text x="24" y="292" font-size="18" fill="#8b1a1a" font-weight="bold" text-anchor="start">3</text>
  <text x="42" y="290" font-size="12" fill="#1a1612" text-anchor="start">isinstance(e, int)</text>
  <text x="24" y="324" font-size="18" fill="#8b1a1a" font-weight="bold" text-anchor="start">4</text>
  <text x="42" y="322" font-size="12" fill="#1a1612" text-anchor="start">e ** 2</text>
  <text x="262" y="258" font-size="13" fill="#1a1612" text-anchor="middle">1</text>
  <text x="262" y="290" font-size="12" fill="#1a1612" text-anchor="middle">True</text>
  <text x="262" y="322" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="middle">1</text>
  <text x="342" y="258" font-size="13" fill="#1a1612" text-anchor="middle">"4"</text>
  <text x="342" y="290" font-size="12" fill="#8b1a1a" text-anchor="middle">False</text>
  <text x="342" y="322" font-size="10.5" fill="#7a6e62" text-anchor="middle">skipped</text>
  <text x="422" y="258" font-size="13" fill="#1a1612" text-anchor="middle">9</text>
  <text x="422" y="290" font-size="12" fill="#1a1612" text-anchor="middle">True</text>
  <text x="422" y="322" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="middle">81</text>
  <text x="502" y="258" font-size="13" fill="#1a1612" text-anchor="middle">"a"</text>
  <text x="502" y="290" font-size="12" fill="#8b1a1a" text-anchor="middle">False</text>
  <text x="502" y="322" font-size="10.5" fill="#7a6e62" text-anchor="middle">skipped</text>
  <text x="582" y="258" font-size="13" fill="#1a1612" text-anchor="middle">0</text>
  <text x="582" y="290" font-size="12" fill="#1a1612" text-anchor="middle">True</text>
  <text x="582" y="322" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="middle">0</text>
  <text x="662" y="258" font-size="13" fill="#1a1612" text-anchor="middle">4</text>
  <text x="662" y="290" font-size="12" fill="#1a1612" text-anchor="middle">True</text>
  <text x="662" y="322" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="middle">16</text>
  <text x="24" y="368" font-size="12" fill="#1a1612" text-anchor="start">squared_ints =</text>
  <text x="228" y="368" font-size="14" fill="#1a1612" font-weight="bold" text-anchor="start">[1, 81, 0, 16]</text>
</svg>
