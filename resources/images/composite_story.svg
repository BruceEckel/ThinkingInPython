<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 550"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>Three steps on the expression 2 * x + 1: Python's operators build a tree of Add, Mul, Num, and Var nodes, evaluate() calls itself on every node and returns 7, and to_infix() walks the same unchanged tree to return the string ((2 * x) + 1)</title>
  <defs>
    <marker id="cs-muted" viewBox="0 0 18 12" refX="17" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5,1.5 L17,6 L1.5,10.5" fill="none" stroke="#7a6e62" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="22" y="54" font-size="30" fill="#8b1a1a" font-weight="bold" text-anchor="start">1</text>
  <text x="22" y="76" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">build</text>
  <text x="22" y="96" font-size="10.5" fill="#7a6e62" text-anchor="start">each operator</text>
  <text x="22" y="111" font-size="10.5" fill="#7a6e62" text-anchor="start">builds a node;</text>
  <text x="22" y="126" font-size="10.5" fill="#7a6e62" text-anchor="start">nothing is</text>
  <text x="22" y="141" font-size="10.5" fill="#7a6e62" text-anchor="start">computed</text>
  <line x1="312" y1="58" x2="245" y2="84" stroke="#1a1612" stroke-width="1.1"/>
  <line x1="348" y1="58" x2="430" y2="84" stroke="#1a1612" stroke-width="1.1"/>
  <line x1="227" y1="110" x2="195" y2="136" stroke="#1a1612" stroke-width="1.1"/>
  <line x1="263" y1="110" x2="295" y2="136" stroke="#1a1612" stroke-width="1.1"/>
  <rect x="288" y="32" width="84" height="26" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="330" y="49" font-size="11" fill="#1a1612" text-anchor="middle">Add</text>
  <rect x="203" y="84" width="84" height="26" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="245" y="101" font-size="11" fill="#1a1612" text-anchor="middle">Mul</text>
  <rect x="388" y="84" width="84" height="26" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="430" y="101" font-size="11" fill="#1a1612" text-anchor="middle">Num(1)</text>
  <rect x="153" y="136" width="84" height="26" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="195" y="153" font-size="11" fill="#1a1612" text-anchor="middle">Num(2)</text>
  <rect x="253" y="136" width="84" height="26" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="295" y="153" font-size="11" fill="#1a1612" text-anchor="middle">Var("x")</text>
  <line x1="482" y1="26" x2="482" y2="170" stroke="#c8bfb0" stroke-width="0.8"/>
  <text x="380" y="49" font-size="10.5" fill="#8b1a1a" text-anchor="start">__add__(1)</text>
  <text x="295" y="101" font-size="10.5" fill="#8b1a1a" text-anchor="start">x.__rmul__(2)</text>
  <text x="430" y="125" font-size="10.5" fill="#8b1a1a" text-anchor="middle">wrap(1)</text>
  <text x="496" y="50" font-size="11" fill="#1a1612" text-anchor="start">x = Var("x")</text>
  <text x="496" y="68" font-size="11" fill="#8b1a1a" text-anchor="start">expr = 2 * x + 1</text>
  <text x="496" y="100" font-size="10" fill="#7a6e62" text-anchor="start">expr.left is</text>
  <text x="496" y="118" font-size="10.5" fill="#1a1612" text-anchor="start">Mul(left=Num(value=2),</text>
  <text x="521.2" y="134" font-size="10.5" fill="#1a1612" text-anchor="start">right=Var(name='x'))</text>
  <line x1="16" y1="186" x2="714" y2="186" stroke="#c8bfb0" stroke-width="0.8"/>
  <text x="22" y="234" font-size="30" fill="#8b1a1a" font-weight="bold" text-anchor="start">2</text>
  <text x="22" y="256" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">evaluate</text>
  <text x="22" y="276" font-size="10.5" fill="#7a6e62" text-anchor="start">the same call</text>
  <text x="22" y="291" font-size="10.5" fill="#7a6e62" text-anchor="start">on every node,</text>
  <text x="22" y="306" font-size="10.5" fill="#7a6e62" text-anchor="start">leaf or group;</text>
  <text x="22" y="321" font-size="10.5" fill="#7a6e62" text-anchor="start">ints flow up</text>
  <line x1="245" y1="264" x2="301.7" y2="242.0" stroke="#7a6e62" stroke-width="1.3" marker-end="url(#cs-muted)"/>
  <line x1="430" y1="264" x2="360.6" y2="242.0" stroke="#7a6e62" stroke-width="1.3" marker-end="url(#cs-muted)"/>
  <line x1="195" y1="316" x2="222.1" y2="294.0" stroke="#7a6e62" stroke-width="1.3" marker-end="url(#cs-muted)"/>
  <line x1="295" y1="316" x2="267.9" y2="294.0" stroke="#7a6e62" stroke-width="1.3" marker-end="url(#cs-muted)"/>
  <rect x="288" y="212" width="84" height="26" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="330" y="229" font-size="11" fill="#1a1612" text-anchor="middle">Add</text>
  <rect x="203" y="264" width="84" height="26" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="245" y="281" font-size="11" fill="#1a1612" text-anchor="middle">Mul</text>
  <rect x="388" y="264" width="84" height="26" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="430" y="281" font-size="11" fill="#1a1612" text-anchor="middle">Num(1)</text>
  <rect x="153" y="316" width="84" height="26" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="195" y="333" font-size="11" fill="#1a1612" text-anchor="middle">Num(2)</text>
  <rect x="253" y="316" width="84" height="26" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="295" y="333" font-size="11" fill="#1a1612" text-anchor="middle">Var("x")</text>
  <line x1="482" y1="206" x2="482" y2="350" stroke="#c8bfb0" stroke-width="0.8"/>
  <text x="380" y="229" font-size="10.5" fill="#8b1a1a" text-anchor="start">7</text>
  <text x="295" y="281" font-size="10.5" fill="#8b1a1a" text-anchor="start">6</text>
  <text x="430" y="305" font-size="10.5" fill="#8b1a1a" text-anchor="middle">1</text>
  <text x="195" y="357" font-size="10.5" fill="#8b1a1a" text-anchor="middle">2</text>
  <text x="295" y="357" font-size="10.5" fill="#8b1a1a" text-anchor="middle">3</text>
  <text x="496" y="230" font-size="11" fill="#1a1612" text-anchor="start">evaluate(expr, x=3)</text>
  <text x="496" y="248" font-size="10" fill="#7a6e62" text-anchor="start">returns</text>
  <text x="496" y="276" font-size="20" fill="#8b1a1a" font-weight="bold" text-anchor="start">7</text>
  <text x="496" y="308" font-size="10" fill="#7a6e62" text-anchor="start">with x=10 the same</text>
  <text x="496" y="322" font-size="10" fill="#7a6e62" text-anchor="start">tree returns 21</text>
  <line x1="16" y1="366" x2="714" y2="366" stroke="#c8bfb0" stroke-width="0.8"/>
  <text x="22" y="414" font-size="30" fill="#8b1a1a" font-weight="bold" text-anchor="start">3</text>
  <text x="22" y="436" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">to_infix</text>
  <text x="22" y="456" font-size="10.5" fill="#7a6e62" text-anchor="start">a second walker</text>
  <text x="22" y="471" font-size="10.5" fill="#7a6e62" text-anchor="start">in infix.py</text>
  <text x="22" y="486" font-size="10.5" fill="#7a6e62" text-anchor="start">reads the same</text>
  <text x="22" y="501" font-size="10.5" fill="#7a6e62" text-anchor="start">tree as text</text>
  <line x1="245" y1="444" x2="301.7" y2="422.0" stroke="#7a6e62" stroke-width="1.3" marker-end="url(#cs-muted)"/>
  <line x1="430" y1="444" x2="360.6" y2="422.0" stroke="#7a6e62" stroke-width="1.3" marker-end="url(#cs-muted)"/>
  <line x1="195" y1="496" x2="222.1" y2="474.0" stroke="#7a6e62" stroke-width="1.3" marker-end="url(#cs-muted)"/>
  <line x1="295" y1="496" x2="267.9" y2="474.0" stroke="#7a6e62" stroke-width="1.3" marker-end="url(#cs-muted)"/>
  <rect x="288" y="392" width="84" height="26" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="330" y="409" font-size="11" fill="#1a1612" text-anchor="middle">Add</text>
  <rect x="203" y="444" width="84" height="26" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="245" y="461" font-size="11" fill="#1a1612" text-anchor="middle">Mul</text>
  <rect x="388" y="444" width="84" height="26" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="430" y="461" font-size="11" fill="#1a1612" text-anchor="middle">Num(1)</text>
  <rect x="153" y="496" width="84" height="26" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="195" y="513" font-size="11" fill="#1a1612" text-anchor="middle">Num(2)</text>
  <rect x="253" y="496" width="84" height="26" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="295" y="513" font-size="11" fill="#1a1612" text-anchor="middle">Var("x")</text>
  <line x1="482" y1="386" x2="482" y2="530" stroke="#c8bfb0" stroke-width="0.8"/>
  <text x="380" y="409" font-size="10.5" fill="#8b1a1a" text-anchor="start">"((2 * x) + 1)"</text>
  <text x="295" y="461" font-size="10.5" fill="#8b1a1a" text-anchor="start">"(2 * x)"</text>
  <text x="430" y="485" font-size="10.5" fill="#8b1a1a" text-anchor="middle">"1"</text>
  <text x="195" y="537" font-size="10.5" fill="#8b1a1a" text-anchor="middle">"2"</text>
  <text x="295" y="537" font-size="10.5" fill="#8b1a1a" text-anchor="middle">"x"</text>
  <text x="496" y="410" font-size="11" fill="#1a1612" text-anchor="start">to_infix(expr)</text>
  <text x="496" y="428" font-size="10" fill="#7a6e62" text-anchor="start">returns</text>
  <text x="496" y="454" font-size="13" fill="#8b1a1a" font-weight="bold" text-anchor="start">((2 * x) + 1)</text>
  <text x="496" y="488" font-size="11" fill="#8b1a1a" text-anchor="start">no edit to the</text>
  <text x="496" y="504" font-size="11" fill="#8b1a1a" text-anchor="start">nodes in expr.py</text>
</svg>
