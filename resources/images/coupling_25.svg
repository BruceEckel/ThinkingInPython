<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 236"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>MyApp inherits ApplicationFramework's internals, while run_framework() names only the Step signature its two functions satisfy</title>
  <defs>
    <marker id="c25-solid" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1a1612" stroke="#1a1612" stroke-width="1"/>
    </marker>
    <marker id="c25-hollow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f5f0e8" stroke="#1a1612" stroke-width="1"/>
    </marker>
  </defs>
  <text x="10" y="20" font-size="13" font-weight="bold" font-style="italic" fill="#1a1612" text-anchor="start">Template Method</text>
  <line x1="10" y1="27" x2="440" y2="27" stroke="#c8bfb0" stroke-width="0.8"/>
  <rect x="20" y="48" width="180" height="38" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="4"/>
  <text x="110.0" y="64.2" font-size="12" font-weight="bold" fill="#1a1612" text-anchor="middle">ApplicationFramework</text>
  <text x="110.0" y="79.2" font-size="9" fill="#7a6e62" text-anchor="middle">run()</text>
  <rect x="20" y="168" width="180" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="110.0" y="191.2" font-size="12" fill="#1a1612" text-anchor="middle">MyApp</text>
  <rect x="256" y="48" width="160" height="38" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="4"/>
  <text x="336.0" y="71.2" font-size="12" font-weight="bold" fill="#1a1612" text-anchor="middle">run_framework()</text>
  <rect x="288" y="108" width="96" height="38" fill="none" stroke="#7a6e62" stroke-width="1.3" rx="12"/>
  <text x="336.0" y="124.2" font-size="12" fill="#7a6e62" text-anchor="middle">Step</text>
  <text x="336.0" y="139.2" font-size="9" fill="#7a6e62" text-anchor="middle">Callable[[], None]</text>
  <rect x="256" y="168" width="160" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4" stroke-dasharray="4,3"/>
  <text x="336.0" y="191.2" font-size="12" fill="#7a6e62" text-anchor="middle">two functions</text>
  <line x1="110.0" y1="166.0" x2="110.0" y2="90.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c25-hollow)"/>
  <text x="180.0" y="132.0" font-size="10.5" fill="#8b1a1a" text-anchor="middle">overrides two steps</text>
  <line x1="336.0" y1="88.0" x2="336.0" y2="104.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c25-solid)"/>
  <line x1="336.0" y1="166.0" x2="336.0" y2="150.0" stroke="#7a6e62" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#c25-hollow)"/>
  <line x1="228" y1="40" x2="228" y2="212" stroke="#c8bfb0" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="10" y="224" font-size="10.5" fill="#7a6e62" text-anchor="start">left: the inherit edge is the widest rung; right: the same algorithm with one thin edge.</text>
  <line x1="480" y1="60" x2="510" y2="60" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c25-solid)"/>
  <text x="518" y="64" font-size="10.5" fill="#7a6e62" text-anchor="start">names a concrete class</text>
  <line x1="480" y1="80" x2="510" y2="80" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c25-solid)"/>
  <text x="518" y="84" font-size="10.5" fill="#7a6e62" text-anchor="start">names an interface</text>
  <line x1="480" y1="100" x2="510" y2="100" stroke="#7a6e62" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#c25-hollow)"/>
  <text x="518" y="104" font-size="10.5" fill="#7a6e62" text-anchor="start">satisfies it</text>
  <line x1="480" y1="120" x2="510" y2="120" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c25-hollow)"/>
  <text x="518" y="124" font-size="10.5" fill="#7a6e62" text-anchor="start">inherits its internals</text>
  <rect x="482" y="132" width="26" height="16" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="3"/>
  <text x="518" y="144" font-size="10.5" fill="#7a6e62" text-anchor="start">kept free of change</text>
</svg>
