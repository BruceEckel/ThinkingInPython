<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 262"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>MyApp inherits ApplicationFramework's internals, while run_framework() names only the Step signature its two functions satisfy</title>
  <defs>
    <marker id="c25-solid" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#1a1612" stroke="#1a1612" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
    <marker id="c25-hollow" viewBox="0 0 18 12" refX="1" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L17.4,6 L1,11 Z" fill="none" stroke="#1a1612" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>
    <marker id="c25-hollow-muted" viewBox="0 0 18 12" refX="1" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L17.4,6 L1,11 Z" fill="none" stroke="#7a6e62" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="10" y="20" font-size="13" font-weight="bold" font-style="italic" fill="#1a1612" text-anchor="start">Template Method</text>
  <line x1="10" y1="27" x2="440" y2="27" stroke="#c8bfb0" stroke-width="0.8"/>
  <rect x="20" y="44" width="180" height="38" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="4"/>
  <text x="110.0" y="60.2" font-size="12" font-weight="bold" fill="#1a1612" text-anchor="middle">ApplicationFramework</text>
  <text x="110.0" y="75.2" font-size="9" fill="#7a6e62" text-anchor="middle">run()</text>
  <rect x="20" y="192" width="180" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="110.0" y="215.2" font-size="12" fill="#1a1612" text-anchor="middle">MyApp</text>
  <rect x="256" y="44" width="160" height="38" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="4"/>
  <text x="336.0" y="67.2" font-size="12" font-weight="bold" fill="#1a1612" text-anchor="middle">run_framework()</text>
  <rect x="271" y="118" width="130" height="38" fill="none" stroke="#7a6e62" stroke-width="1.3" rx="12"/>
  <text x="336.0" y="134.2" font-size="12" fill="#7a6e62" text-anchor="middle">Step</text>
  <text x="336.0" y="149.2" font-size="9" fill="#7a6e62" text-anchor="middle">Callable[[], None]</text>
  <rect x="256" y="192" width="160" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="336.0" y="215.2" font-size="12" fill="#1a1612" text-anchor="middle">two lambdas</text>
  <line x1="110.0" y1="190.0" x2="110.0" y2="102.4" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c25-hollow)"/>
  <text x="180.0" y="142.0" font-size="10.5" fill="#8b1a1a" text-anchor="middle">overrides two steps</text>
  <line x1="336.0" y1="84.0" x2="336.0" y2="101.6" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c25-solid)"/>
  <line x1="336.0" y1="190.0" x2="336.0" y2="176.4" stroke="#7a6e62" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#c25-hollow-muted)"/>
  <line x1="228" y1="40" x2="228" y2="236" stroke="#c8bfb0" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="10" y="250" font-size="10.5" fill="#7a6e62" text-anchor="start">left: the inherit edge is the widest rung; right: the same algorithm with one thin edge.</text>
  <line x1="480" y1="60" x2="497.6" y2="60" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c25-solid)"/>
  <text x="518" y="64" font-size="10.5" fill="#7a6e62" text-anchor="start">names a concrete class</text>
  <line x1="480" y1="80" x2="497.6" y2="80" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c25-solid)"/>
  <text x="518" y="84" font-size="10.5" fill="#7a6e62" text-anchor="start">names an interface</text>
  <line x1="480" y1="100" x2="493.6" y2="100" stroke="#7a6e62" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#c25-hollow-muted)"/>
  <text x="518" y="104" font-size="10.5" fill="#7a6e62" text-anchor="start">satisfies it</text>
  <line x1="480" y1="120" x2="493.6" y2="120" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c25-hollow)"/>
  <text x="518" y="124" font-size="10.5" fill="#7a6e62" text-anchor="start">inherits its internals</text>
  <rect x="482" y="132" width="26" height="16" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="3"/>
  <text x="518" y="144" font-size="10.5" fill="#7a6e62" text-anchor="start">kept free of change</text>
</svg>
