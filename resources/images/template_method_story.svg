  <text x="440" y="408" font-size="11" fill="#1a1612" text-anchor="middle">customize2()</text>
  <text x="440" y="424" font-size="10" fill="#7a6e62" text-anchor="middle">"Say no more, say no more!"</text>
  <line x1="440" y1="332" x2="440.0" y2="375.6" stroke="#1a1612" stroke-width="1.3" marker-end="url(#tms-ink)"/>
  <text x="446" y="360" font-size="10" fill="#1a1612" text-anchor="start">self.customize2()</text>
  <text x="562" y="268" font-size="11" fill="#8b1a1a" text-anchor="start">MyApp().run()</text>
