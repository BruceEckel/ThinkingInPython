  <text x="157" y="268" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">ApplicationFramework</text>
  <text x="157" y="290" font-size="11" fill="#1a1612" text-anchor="start">for _ in range(2):</text>
  <rect x="165" y="302" width="170" height="30" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="250" y="321" font-size="11" fill="#1a1612" text-anchor="middle">customize1()</text>
  <rect x="355" y="302" width="170" height="30" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="440" y="321" font-size="11" fill="#1a1612" text-anchor="middle">customize2()</text>
  <text x="528" y="268" font-size="11" fill="#8b1a1a" text-anchor="end">@final run()</text>
  <path d="M149,370 H536 Q540,370 540,374 V442 Q540,446 536,446 H149 Q145,446 145,442 V374 Q145,370 149,370 Z" fill="none" stroke="#1a1612" stroke-width="1.6"/>
  <text x="157" y="386" font-size="11" fill="#1a1612" font-weight="bold" text-anchor="start">MyApp</text>
  <rect x="165" y="392" width="170" height="42" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="250" y="408" font-size="11" fill="#1a1612" text-anchor="middle">customize1()</text>
  <text x="250" y="424" font-size="10" fill="#7a6e62" text-anchor="middle">"Nudge, nudge, wink, wink!"</text>
