  <rect x="165" y="170" width="170" height="42" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="250" y="186" font-size="11" fill="#1a1612" text-anchor="middle">customize1()</text>
  <text x="250" y="202" font-size="10" fill="#7a6e62" text-anchor="middle">...</text>
  <line x1="250" y1="110" x2="250.0" y2="153.6" stroke="#1a1612" stroke-width="1.3" marker-end="url(#tms-ink)"/>
  <text x="256" y="138" font-size="10" fill="#1a1612" text-anchor="start">self.customize1()</text>
  <rect x="355" y="170" width="170" height="42" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="440" y="186" font-size="11" fill="#1a1612" text-anchor="middle">customize2()</text>
  <text x="440" y="202" font-size="10" fill="#7a6e62" text-anchor="middle">...</text>
  <line x1="440" y1="110" x2="440.0" y2="153.6" stroke="#1a1612" stroke-width="1.3" marker-end="url(#tms-ink)"/>
  <text x="446" y="138" font-size="10" fill="#1a1612" text-anchor="start">self.customize2()</text>
  <text x="562" y="46" font-size="11" fill="#1a1612" text-anchor="start">@final:</text>
  <text x="562" y="64" font-size="10" fill="#7a6e62" text-anchor="start">no subclass may</text>
  <text x="562" y="78" font-size="10" fill="#7a6e62" text-anchor="start">override run()</text>
  <line x1="16" y1="228" x2="714" y2="228" stroke="#c8bfb0" stroke-width="0.8"/>
  <text x="22" y="276" font-size="30" fill="#8b1a1a" font-weight="bold" text-anchor="start">2</text>
  <text x="22" y="298" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">fill in</text>
  <text x="22" y="318" font-size="10.5" fill="#7a6e62" text-anchor="start">MyApp overrides</text>
