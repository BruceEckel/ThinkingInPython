  <text x="562" y="308" font-size="10" fill="#1a1612" text-anchor="start">Nudge, nudge, wink, wink!</text>
  <text x="562" y="325" font-size="10" fill="#1a1612" text-anchor="start">Say no more, say no more!</text>
  <text x="562" y="342" font-size="10" fill="#1a1612" text-anchor="start">Nudge, nudge, wink, wink!</text>
  <text x="562" y="359" font-size="10" fill="#1a1612" text-anchor="start">Say no more, say no more!</text>
  <line x1="16" y1="450" x2="714" y2="450" stroke="#c8bfb0" stroke-width="0.8"/>
  <text x="22" y="498" font-size="30" fill="#8b1a1a" font-weight="bold" text-anchor="start">3</text>
  <text x="22" y="520" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">pass</text>
  <text x="22" y="540" font-size="10.5" fill="#7a6e62" text-anchor="start">the same loop</text>
  <text x="22" y="555" font-size="10.5" fill="#7a6e62" text-anchor="start">in a function;</text>
  <text x="22" y="570" font-size="10.5" fill="#7a6e62" text-anchor="start">the steps come</text>
  <text x="22" y="585" font-size="10.5" fill="#7a6e62" text-anchor="start">in as arguments</text>
