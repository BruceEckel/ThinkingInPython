  <text x="157" y="46" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">ApplicationFramework</text>
  <text x="157" y="68" font-size="11" fill="#1a1612" text-anchor="start">for _ in range(2):</text>
  <rect x="165" y="80" width="170" height="30" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="250" y="99" font-size="11" fill="#1a1612" text-anchor="middle">customize1()</text>
  <rect x="355" y="80" width="170" height="30" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="440" y="99" font-size="11" fill="#1a1612" text-anchor="middle">customize2()</text>
  <text x="528" y="46" font-size="11" fill="#8b1a1a" text-anchor="end">@final run()</text>
