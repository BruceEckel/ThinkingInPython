<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 676"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>Three steps of Template Method: ApplicationFramework.run() sets the order of two steps, MyApp overrides them and run() calls each one twice, and run_framework() runs the same loop on two lambdas</title>
  <defs>
    <marker id="tms-ink" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#1a1612" stroke="#1a1612" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="22" y="54" font-size="30" fill="#8b1a1a" font-weight="bold" text-anchor="start">1</text>
  <text x="22" y="76" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">anchor</text>
  <text x="22" y="96" font-size="10.5" fill="#7a6e62" text-anchor="start">run() sets the</text>
  <text x="22" y="111" font-size="10.5" fill="#7a6e62" text-anchor="start">order; each</text>
  <text x="22" y="126" font-size="10.5" fill="#7a6e62" text-anchor="start">step is a hook</text>
