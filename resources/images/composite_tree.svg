<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>A filesystem tree in which every node answers disk_usage(): each file returns its size, src returns 400 + 250 = 650, and root returns 90 + 650 + 1200 = 1940, beside the demo's three calls, which print 1940 650 10</title>
  <defs>
    <marker id="ct-muted" viewBox="0 0 18 12" refX="17" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5,1.5 L17,6 L1.5,10.5" fill="none" stroke="#7a6e62" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <line x1="80" y1="108" x2="188.9" y2="72.0" stroke="#7a6e62" stroke-width="1.3" marker-end="url(#ct-muted)"/>
  <line x1="245" y1="108" x2="245.0" y2="72.0" stroke="#7a6e62" stroke-width="1.3" marker-end="url(#ct-muted)"/>
  <line x1="410" y1="108" x2="301.1" y2="72.0" stroke="#7a6e62" stroke-width="1.3" marker-end="url(#ct-muted)"/>
  <line x1="180" y1="202" x2="218.7" y2="166.0" stroke="#7a6e62" stroke-width="1.3" marker-end="url(#ct-muted)"/>
  <line x1="310" y1="202" x2="271.3" y2="166.0" stroke="#7a6e62" stroke-width="1.3" marker-end="url(#ct-muted)"/>
  <rect x="155" y="14" width="180" height="54" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="245" y="29" font-size="10" fill="#7a6e62" text-anchor="middle">Directory</text>
  <text x="245" y="45" font-size="11.5" fill="#1a1612" font-weight="bold" text-anchor="middle">root</text>
  <text x="245" y="61" font-size="11" fill="#8b1a1a" text-anchor="middle">90 + 650 + 1200 = 1940</text>
  <rect x="22" y="108" width="116" height="54" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="80" y="123" font-size="10" fill="#7a6e62" text-anchor="middle">File</text>
  <text x="80" y="139" font-size="11.5" fill="#1a1612" font-weight="bold" text-anchor="middle">readme.md</text>
  <text x="80" y="155" font-size="11" fill="#8b1a1a" text-anchor="middle">90</text>
  <rect x="180" y="108" width="130" height="54" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="245" y="123" font-size="10" fill="#7a6e62" text-anchor="middle">Directory</text>
  <text x="245" y="139" font-size="11.5" fill="#1a1612" font-weight="bold" text-anchor="middle">src</text>
  <text x="245" y="155" font-size="11" fill="#8b1a1a" text-anchor="middle">400 + 250 = 650</text>
  <rect x="352" y="108" width="116" height="54" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="410" y="123" font-size="10" fill="#7a6e62" text-anchor="middle">File</text>
  <text x="410" y="139" font-size="11.5" fill="#1a1612" font-weight="bold" text-anchor="middle">data.csv</text>
  <text x="410" y="155" font-size="11" fill="#8b1a1a" text-anchor="middle">1200</text>
  <rect x="125" y="202" width="110" height="54" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="180" y="217" font-size="10" fill="#7a6e62" text-anchor="middle">File</text>
  <text x="180" y="233" font-size="11.5" fill="#1a1612" font-weight="bold" text-anchor="middle">main.py</text>
  <text x="180" y="249" font-size="11" fill="#8b1a1a" text-anchor="middle">400</text>
  <rect x="255" y="202" width="110" height="54" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="310" y="217" font-size="10" fill="#7a6e62" text-anchor="middle">File</text>
  <text x="310" y="233" font-size="11.5" fill="#1a1612" font-weight="bold" text-anchor="middle">util.py</text>
  <text x="310" y="249" font-size="11" fill="#8b1a1a" text-anchor="middle">250</text>
  <line x1="492" y1="20" x2="492" y2="250" stroke="#c8bfb0" stroke-width="0.8"/>
  <text x="506" y="34" font-size="10.5" fill="#7a6e62" text-anchor="start">the same call on</text>
  <text x="506" y="49" font-size="10.5" fill="#7a6e62" text-anchor="start">any node:</text>
  <text x="506" y="74" font-size="10.5" fill="#1a1612" text-anchor="start">disk_usage(root)</text>
  <text x="710" y="74" font-size="11" fill="#8b1a1a" font-weight="bold" text-anchor="end">1940</text>
  <text x="506" y="98" font-size="10.5" fill="#1a1612" text-anchor="start">disk_usage(src)</text>
  <text x="710" y="98" font-size="11" fill="#8b1a1a" font-weight="bold" text-anchor="end">650</text>
  <text x="506" y="122" font-size="10.5" fill="#1a1612" text-anchor="start">disk_usage(</text>
  <text x="518.6" y="137" font-size="10.5" fill="#1a1612" text-anchor="start">File("lone.txt", 10))</text>
  <text x="710" y="137" font-size="11" fill="#8b1a1a" font-weight="bold" text-anchor="end">10</text>
  <text x="506" y="186" font-size="10.5" fill="#7a6e62" text-anchor="start">the demo prints</text>
  <text x="506" y="210" font-size="14" fill="#8b1a1a" font-weight="bold" text-anchor="start">1940 650 10</text>
</svg>
