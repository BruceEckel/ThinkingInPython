<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 770"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>Four steps of Observer: responders subscribe as callables, an assignment to celsius calls each one, none replies, and a new responder subscribes with no change to Thermometer</title>
  <defs>
    <marker id="os-ink" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#1a1612" stroke="#1a1612" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
    <marker id="os-red" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#8b1a1a" stroke="#8b1a1a" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
    <marker id="os-muted" viewBox="0 0 18 12" refX="17" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5,1.5 L17,6 L1.5,10.5" fill="none" stroke="#7a6e62" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <path d="M452,16 H720 V188 H452 Z" fill="#c8bfb0" fill-opacity="0.22" stroke="none" stroke-width="1.6"/>
  <path d="M144,24 H386 Q390,24 390,28 V180 Q390,184 386,184 H144 Q140,184 140,180 V28 Q140,24 144,24 Z" fill="none" stroke="#1a1612" stroke-width="1.6"/>
  <text x="152" y="44" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">Thermometer</text>
  <text x="285" y="54" font-size="10" fill="#7a6e62" text-anchor="start">_responders</text>
  <rect x="285" y="60" width="95" height="26" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="332.5" y="77" font-size="10.5" fill="#7a6e62" text-anchor="middle">callable</text>
  <rect x="285" y="104" width="95" height="26" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="332.5" y="121" font-size="10.5" fill="#7a6e62" text-anchor="middle">callable</text>
  <rect x="285" y="148" width="95" height="26" fill="none" stroke="#c8bfb0" stroke-width="1.1" rx="3" stroke-dasharray="4,3"/>
  <rect x="530" y="55" width="170" height="36" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <rect x="530" y="99" width="170" height="36" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="22" y="54" font-size="30" fill="#8b1a1a" font-weight="bold" text-anchor="start">1</text>
  <text x="22" y="76" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">subscribe</text>
  <text x="22" y="96" font-size="10.5" fill="#7a6e62" text-anchor="start">each responder</text>
  <text x="22" y="111" font-size="10.5" fill="#7a6e62" text-anchor="start">is stored as</text>
  <text x="22" y="126" font-size="10.5" fill="#7a6e62" text-anchor="start">a callable</text>
  <text x="712" y="34" font-size="10" fill="#7a6e62" text-anchor="end">hidden from Thermometer</text>
  <text x="152" y="80" font-size="11" fill="#1a1612" text-anchor="start">celsius: 20.0</text>
  <text x="615" y="78" font-size="12.5" fill="#1a1612" text-anchor="middle">display</text>
  <line x1="530" y1="73" x2="396.4" y2="73.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#os-ink)"/>
  <text x="465" y="67" font-size="10" fill="#1a1612" text-anchor="middle">t.subscribe(display)</text>
  <text x="615" y="122" font-size="12.5" fill="#1a1612" text-anchor="middle">alarm</text>
  <line x1="530" y1="117" x2="396.4" y2="117.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#os-ink)"/>
  <text x="465" y="111" font-size="10" fill="#1a1612" text-anchor="middle">t.subscribe(alarm)</text>
