  <path d="M144,214 H386 Q390,214 390,218 V370 Q390,374 386,374 H144 Q140,374 140,370 V218 Q140,214 144,214 Z" fill="none" stroke="#1a1612" stroke-width="1.6"/>
  <text x="152" y="234" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">Thermometer</text>
  <text x="285" y="244" font-size="10" fill="#7a6e62" text-anchor="start">_responders</text>
  <rect x="285" y="250" width="95" height="26" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="332.5" y="267" font-size="10.5" fill="#7a6e62" text-anchor="middle">callable</text>
  <rect x="285" y="294" width="95" height="26" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="332.5" y="311" font-size="10.5" fill="#7a6e62" text-anchor="middle">callable</text>
  <rect x="285" y="338" width="95" height="26" fill="none" stroke="#c8bfb0" stroke-width="1.1" rx="3" stroke-dasharray="4,3"/>
  <rect x="530" y="245" width="170" height="36" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <rect x="530" y="289" width="170" height="36" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="22" y="244" font-size="30" fill="#8b1a1a" font-weight="bold" text-anchor="start">2</text>
  <text x="22" y="266" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">change</text>
  <text x="22" y="286" font-size="10.5" fill="#7a6e62" text-anchor="start">t.celsius = 150</text>
  <text x="22" y="301" font-size="10.5" fill="#7a6e62" text-anchor="start">runs the setter,</text>
  <text x="22" y="316" font-size="10.5" fill="#7a6e62" text-anchor="start">which announces</text>
  <text x="152" y="270" font-size="11" fill="#8b1a1a" text-anchor="start">celsius: 150</text>
  <text x="152" y="292" font-size="11" fill="#8b1a1a" text-anchor="start">announce(150)</text>
  <text x="152" y="310" font-size="10" fill="#7a6e62" text-anchor="start">iterates</text>
  <text x="152" y="324" font-size="10" fill="#7a6e62" text-anchor="start">through the list</text>
  <text x="615" y="268" font-size="12.5" fill="#1a1612" text-anchor="middle">display</text>
  <line x1="380" y1="263" x2="513.6" y2="263.0" stroke="#8b1a1a" stroke-width="1.6" marker-end="url(#os-red)"/>
  <text x="455" y="257" font-size="10" fill="#8b1a1a" text-anchor="middle">responder(150)</text>
  <text x="615" y="312" font-size="12.5" fill="#1a1612" text-anchor="middle">alarm</text>
  <line x1="380" y1="307" x2="513.6" y2="307.0" stroke="#8b1a1a" stroke-width="1.6" marker-end="url(#os-red)"/>
  <text x="455" y="301" font-size="10" fill="#8b1a1a" text-anchor="middle">responder(150)</text>
  <line x1="16" y1="386" x2="714" y2="386" stroke="#c8bfb0" stroke-width="0.8"/>
  <path d="M452,396 H720 V568 H452 Z" fill="#c8bfb0" fill-opacity="0.22" stroke="none" stroke-width="1.6"/>
  <path d="M144,404 H386 Q390,404 390,408 V560 Q390,564 386,564 H144 Q140,564 140,560 V408 Q140,404 144,404 Z" fill="none" stroke="#1a1612" stroke-width="1.6"/>
  <text x="152" y="424" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">Thermometer</text>
  <text x="285" y="434" font-size="10" fill="#7a6e62" text-anchor="start">_responders</text>
  <rect x="285" y="440" width="95" height="26" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="332.5" y="457" font-size="10.5" fill="#7a6e62" text-anchor="middle">callable</text>
  <rect x="285" y="484" width="95" height="26" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="332.5" y="501" font-size="10.5" fill="#7a6e62" text-anchor="middle">callable</text>
  <rect x="285" y="528" width="95" height="26" fill="none" stroke="#c8bfb0" stroke-width="1.1" rx="3" stroke-dasharray="4,3"/>
  <rect x="530" y="435" width="170" height="36" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <rect x="530" y="479" width="170" height="36" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="22" y="434" font-size="30" fill="#8b1a1a" font-weight="bold" text-anchor="start">3</text>
  <text x="22" y="456" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">respond</text>
  <text x="22" y="476" font-size="10.5" fill="#7a6e62" text-anchor="start">each reacts in</text>
  <text x="22" y="491" font-size="10.5" fill="#7a6e62" text-anchor="start">its own way;</text>
  <text x="22" y="506" font-size="10.5" fill="#7a6e62" text-anchor="start">none replies</text>
  <text x="152" y="460" font-size="11" fill="#1a1612" text-anchor="start">celsius: 150</text>
  <text x="152" y="482" font-size="11" fill="#1a1612" text-anchor="start">announce()</text>
  <text x="152" y="496" font-size="11" fill="#1a1612" text-anchor="start">returns</text>
  <text x="615" y="458" font-size="12.5" fill="#8b1a1a" text-anchor="middle">display: 150C</text>
  <line x1="530" y1="453" x2="384.0" y2="453.0" stroke="#7a6e62" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#os-muted)"/>
  <path d="M449,447 L461,459 M449,459 L461,447" stroke="#8b1a1a" stroke-width="2" fill="none"/>
  <text x="615" y="502" font-size="12.5" fill="#8b1a1a" text-anchor="middle">alarm!</text>
  <line x1="530" y1="497" x2="384.0" y2="497.0" stroke="#7a6e62" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#os-muted)"/>
  <path d="M449,491 L461,503 M449,503 L461,491" stroke="#8b1a1a" stroke-width="2" fill="none"/>
  <text x="455" y="443" font-size="10" fill="#7a6e62" text-anchor="middle">returns None</text>
  <line x1="16" y1="576" x2="714" y2="576" stroke="#c8bfb0" stroke-width="0.8"/>
  <path d="M452,586 H720 V758 H452 Z" fill="#c8bfb0" fill-opacity="0.22" stroke="none" stroke-width="1.6"/>
  <path d="M144,594 H386 Q390,594 390,598 V750 Q390,754 386,754 H144 Q140,754 140,750 V598 Q140,594 144,594 Z" fill="none" stroke="#8b1a1a" stroke-width="1.6"/>
  <text x="152" y="614" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">Thermometer</text>
  <text x="285" y="624" font-size="10" fill="#7a6e62" text-anchor="start">_responders</text>
  <rect x="285" y="630" width="95" height="26" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="332.5" y="647" font-size="10.5" fill="#7a6e62" text-anchor="middle">callable</text>
  <rect x="285" y="674" width="95" height="26" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="332.5" y="691" font-size="10.5" fill="#7a6e62" text-anchor="middle">callable</text>
  <rect x="285" y="718" width="95" height="26" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="332.5" y="735" font-size="10.5" fill="#7a6e62" text-anchor="middle">callable</text>
  <rect x="530" y="625" width="170" height="36" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <rect x="530" y="669" width="170" height="36" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <rect x="530" y="713" width="170" height="36" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4" stroke-dasharray="4,3"/>
  <text x="22" y="624" font-size="30" fill="#8b1a1a" font-weight="bold" text-anchor="start">4</text>
  <text x="22" y="646" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">extend</text>
  <text x="22" y="666" font-size="10.5" fill="#7a6e62" text-anchor="start">a new responder</text>
  <text x="22" y="681" font-size="10.5" fill="#7a6e62" text-anchor="start">subscribes the</text>
  <text x="22" y="696" font-size="10.5" fill="#7a6e62" text-anchor="start">same way</text>
  <text x="152" y="650" font-size="11" fill="#8b1a1a" text-anchor="start">no edit to</text>
  <text x="152" y="665" font-size="11" fill="#8b1a1a" text-anchor="start">Thermometer</text>
  <text x="615" y="648" font-size="12.5" fill="#1a1612" text-anchor="middle">display</text>
  <text x="615" y="692" font-size="12.5" fill="#1a1612" text-anchor="middle">alarm</text>
  <text x="615" y="736" font-size="12.5" fill="#7a6e62" text-anchor="middle">plot</text>
  <line x1="530" y1="731" x2="396.4" y2="731.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#os-ink)"/>
  <text x="465" y="725" font-size="10" fill="#1a1612" text-anchor="middle">t.subscribe(plot)</text>
</svg>
