<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 475"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>One duel's two calls: scissors.compete(paper) knows only Scissors, so it calls paper.eval_scissors(scissors) with self and item swapped, which knows both types and returns WIN, the result for scissors</title>
  <defs>
    <marker id="dd-ink" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#1a1612" stroke="#1a1612" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
    <marker id="dd-muted" viewBox="0 0 18 12" refX="17" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5,1.5 L17,6 L1.5,10.5" fill="none" stroke="#7a6e62" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="20" y="34" font-size="26" fill="#8b1a1a" font-weight="bold" text-anchor="start">1</text>
  <text x="44" y="32" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">first dispatch</text>
  <text x="20" y="64" font-size="12" fill="#7a6e62" text-anchor="start">duel() calls</text>
  <text x="113.6" y="64" font-size="12" fill="#1a1612" text-anchor="start">scissors.compete(paper)</text>
  <path d="M24,80 H316 Q320,80 320,84 V276 Q320,280 316,280 H24 Q20,280 20,276 V84 Q20,80 24,80 Z" fill="none" stroke="#1a1612" stroke-width="1.6"/>
  <text x="40" y="107" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">Scissors.compete()</text>
  <rect x="40" y="125" width="250" height="34" fill="none" stroke="#1a1612" stroke-width="1.1" rx="4"/>
  <text x="52" y="147" font-size="11" fill="#7a6e62" text-anchor="start">self</text>
  <text x="185" y="147" font-size="12.5" fill="#1a1612" text-anchor="middle">scissors</text>
  <rect x="40" y="175" width="250" height="34" fill="none" stroke="#1a1612" stroke-width="1.1" rx="4"/>
  <text x="52" y="197" font-size="11" fill="#7a6e62" text-anchor="start">item</text>
  <text x="185" y="197" font-size="12.5" fill="#1a1612" text-anchor="middle">paper</text>
  <text x="40" y="238" font-size="10.5" fill="#7a6e62" text-anchor="start">self's type picks the method:</text>
  <text x="40" y="256" font-size="11" fill="#8b1a1a" text-anchor="start">Scissors known</text>
  <text x="40" y="272" font-size="10.5" fill="#7a6e62" text-anchor="start">item's type still unknown</text>
  <text x="410" y="34" font-size="26" fill="#8b1a1a" font-weight="bold" text-anchor="start">2</text>
  <text x="434" y="32" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">second dispatch</text>
  <text x="410" y="64" font-size="12" fill="#7a6e62" text-anchor="start">compete() calls</text>
  <text x="525.2" y="64" font-size="12" fill="#1a1612" text-anchor="start">item.eval_scissors(self)</text>
  <path d="M414,80 H706 Q710,80 710,84 V276 Q710,280 706,280 H414 Q410,280 410,276 V84 Q410,80 414,80 Z" fill="none" stroke="#1a1612" stroke-width="1.6"/>
  <text x="430" y="107" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">Paper.eval_scissors()</text>
  <rect x="430" y="125" width="250" height="34" fill="none" stroke="#1a1612" stroke-width="1.1" rx="4"/>
  <text x="442" y="147" font-size="11" fill="#7a6e62" text-anchor="start">self</text>
  <text x="575" y="147" font-size="12.5" fill="#1a1612" text-anchor="middle">paper</text>
  <rect x="430" y="175" width="250" height="34" fill="none" stroke="#1a1612" stroke-width="1.1" rx="4"/>
  <text x="442" y="197" font-size="11" fill="#7a6e62" text-anchor="start">item</text>
  <text x="575" y="197" font-size="12.5" fill="#1a1612" text-anchor="middle">scissors</text>
  <text x="430" y="238" font-size="10.5" fill="#7a6e62" text-anchor="start">self's type picks the method:</text>
  <text x="430" y="256" font-size="11" fill="#8b1a1a" text-anchor="start">Paper known</text>
  <text x="430" y="272" font-size="10.5" fill="#1a1612" text-anchor="start">Scissors known from the name</text>
  <line x1="290" y1="142" x2="414.6" y2="186.5" stroke="#1a1612" stroke-width="1.3" marker-end="url(#dd-ink)"/>
  <line x1="290" y1="192" x2="414.6" y2="147.5" stroke="#1a1612" stroke-width="1.3" marker-end="url(#dd-ink)"/>
  <text x="360" y="117" font-size="11" fill="#8b1a1a" text-anchor="middle">swap</text>
  <text x="20" y="334" font-size="26" fill="#8b1a1a" font-weight="bold" text-anchor="start">3</text>
  <text x="44" y="332" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">answer</text>
  <rect x="430" y="350" width="250" height="34" fill="none" stroke="#1a1612" stroke-width="1.1" rx="4"/>
  <text x="555" y="372" font-size="12" fill="#1a1612" text-anchor="middle">return Outcome.WIN</text>
  <rect x="40" y="350" width="250" height="34" fill="none" stroke="#1a1612" stroke-width="1.1" rx="4"/>
  <text x="165" y="372" font-size="12" fill="#1a1612" text-anchor="middle">duel() prints</text>
  <line x1="430" y1="367" x2="294.0" y2="367.0" stroke="#7a6e62" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#dd-muted)"/>
  <text x="360" y="357" font-size="10.5" fill="#7a6e62" text-anchor="middle">via</text>
  <text x="360" y="386" font-size="10.5" fill="#7a6e62" text-anchor="middle">compete()</text>
  <text x="40" y="410" font-size="12.5" fill="#8b1a1a" text-anchor="start">Scissors &lt;--&gt; Paper : win</text>
  <text x="40" y="440" font-size="11" fill="#8b1a1a" text-anchor="start">WIN answers for scissors, the type in the name eval_scissors,</text>
  <text x="40" y="457" font-size="11" fill="#8b1a1a" text-anchor="start">not for the Paper whose code runs: scissors cut paper.</text>
</svg>
