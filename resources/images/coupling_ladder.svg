<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 374"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>Six degrees of what one part of a program knows about another, from inheriting its internals down to receiving a value</title>
  <defs>
    <marker id="ld-solid" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1a1612" stroke="#1a1612" stroke-width="1"/>
    </marker>
    <marker id="ld-hollow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f5f0e8" stroke="#1a1612" stroke-width="1"/>
    </marker>
  </defs>
  <text x="30" y="24" font-size="12" fill="#7a6e62" text-anchor="start">The dependent part knows</text>
  <text x="30" y="39" font-size="12" fill="#7a6e62" text-anchor="start">this much about the part it uses:</text>
  <text x="420" y="39" font-size="12" fill="#7a6e62" text-anchor="start">Patterns whose central edge ends on this rung</text>
  <line x1="30" y1="52" x2="30" y2="338" stroke="#1a1612" stroke-width="1.2"/>
  <line x1="390" y1="52" x2="390" y2="338" stroke="#1a1612" stroke-width="1.2"/>
  <line x1="30" y1="62" x2="390" y2="62" stroke="#1a1612" stroke-width="5.0"/>
  <text x="42" y="80" font-size="12.5" font-weight="bold" fill="#1a1612" text-anchor="start">its internals</text>
  <text x="42" y="97" font-size="10.5" fill="#7a6e62" text-anchor="start">class Child(Parent):</text>
  <text x="420" y="80" font-size="11" font-style="italic" fill="#1a1612" text-anchor="start">Template Method</text>
  <line x1="30" y1="108" x2="390" y2="108" stroke="#1a1612" stroke-width="3.8"/>
  <text x="42" y="126" font-size="12.5" fill="#1a1612" text-anchor="start">its name</text>
  <text x="42" y="143" font-size="10.5" fill="#7a6e62" text-anchor="start">Circle(2)    isinstance(s, Circle)</text>
  <text x="420" y="126" font-size="11" fill="#7a6e62" text-anchor="start">the starting point: no pattern yet</text>
  <line x1="30" y1="154" x2="390" y2="154" stroke="#1a1612" stroke-width="2.6"/>
  <text x="42" y="172" font-size="12.5" fill="#1a1612" text-anchor="start">an interface it declares</text>
  <text x="42" y="189" font-size="10.5" fill="#7a6e62" text-anchor="start">class Circle(Shape):    # Shape is an ABC</text>
  <text x="420" y="172" font-size="11" font-style="italic" fill="#1a1612" text-anchor="start">Observer (classic), Visitor, Abstract Factory</text>
  <line x1="30" y1="200" x2="390" y2="200" stroke="#1a1612" stroke-width="1.8"/>
  <text x="42" y="218" font-size="12.5" fill="#1a1612" text-anchor="start">a shape it has</text>
  <text x="42" y="235" font-size="10.5" fill="#7a6e62" text-anchor="start">class Shape(Protocol):</text>
  <text x="420" y="218" font-size="11" font-style="italic" fill="#1a1612" text-anchor="start">Surrogate, Adapter, Iterator</text>
  <line x1="30" y1="246" x2="390" y2="246" stroke="#1a1612" stroke-width="1.3"/>
  <text x="42" y="264" font-size="12.5" fill="#1a1612" text-anchor="start">a signature</text>
  <text x="42" y="281" font-size="10.5" fill="#7a6e62" text-anchor="start">Callable[[float], float]</text>
  <text x="420" y="264" font-size="11" font-style="italic" fill="#1a1612" text-anchor="start">Strategy, Command, Observer (Python)</text>
  <line x1="30" y1="292" x2="390" y2="292" stroke="#1a1612" stroke-width="0.9"/>
  <text x="42" y="310" font-size="12.5" fill="#1a1612" text-anchor="start">a value</text>
  <text x="42" y="327" font-size="10.5" fill="#7a6e62" text-anchor="start">queue.put(event)</text>
  <text x="420" y="310" font-size="11" font-style="italic" fill="#1a1612" text-anchor="start">Memento, Data Transfer Objects</text>
  <line x1="404" y1="202" x2="404" y2="290" stroke="#8b1a1a" stroke-width="1.4"/>
  <line x1="404" y1="202" x2="410" y2="202" stroke="#8b1a1a" stroke-width="1.4"/>
  <line x1="404" y1="290" x2="410" y2="290" stroke="#8b1a1a" stroke-width="1.4"/>
  <text x="30" y="360" font-size="10.5" fill="#7a6e62" text-anchor="start">Rung width: how much of the used part a change can reach.</text>
  <text x="420" y="360" font-size="10.5" fill="#8b1a1a" text-anchor="start">Bracket: Python supplies these interfaces.</text>
</svg>
