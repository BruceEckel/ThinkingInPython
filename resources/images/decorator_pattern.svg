<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 470"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>Margherita and Hawaiian satisfy Pizza directly; Topping wraps a Pizza and also satisfies it, so Garlic, Olives, and Feta can wrap any pizza, including each other</title>
  <defs>
    <marker id="dp-tri" viewBox="0 0 18 12" refX="1" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L17.4,6 L1,11 Z" fill="none" stroke="#1a1612" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>
    <marker id="dp-tri-muted" viewBox="0 0 18 12" refX="1" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L17.4,6 L1,11 Z" fill="none" stroke="#7a6e62" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>
    <marker id="dp-diamond" viewBox="0 0 22 12" refX="21" refY="6"
            markerWidth="22" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,6 L11,1 L21,6 L11,11 Z" fill="none" stroke="#1a1612" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- realization: Margherita, Hawaiian, and Topping implement Pizza -->
  <line x1="105" y1="190" x2="405.7" y2="117.8" stroke="#7a6e62" stroke-width="1.2"
        stroke-dasharray="5,4" marker-end="url(#dp-tri-muted)"/>
  <line x1="305" y1="190" x2="441.5" y2="121.4" stroke="#7a6e62" stroke-width="1.2"
        stroke-dasharray="5,4" marker-end="url(#dp-tri-muted)"/>
  <line x1="535" y1="190" x2="507.6" y2="129" stroke="#7a6e62" stroke-width="1.2"
        stroke-dasharray="5,4" marker-end="url(#dp-tri-muted)"/>

  <!-- inheritance: Garlic, Olives, and Feta extend Topping -->
  <line x1="435" y1="350" x2="465.1" y2="318" stroke="#1a1612" stroke-width="1.2"
        marker-end="url(#dp-tri)"/>
  <line x1="625" y1="350" x2="557" y2="313.7" stroke="#1a1612" stroke-width="1.2"
        marker-end="url(#dp-tri)"/>
  <line x1="815" y1="350" x2="624.9" y2="309.4" stroke="#1a1612" stroke-width="1.2"
        marker-end="url(#dp-tri)"/>

  <!-- aggregation: Topping "has a" Pizza -->
  <path d="M656.7,209 Q755.9,137.9 570,110" fill="none" stroke="#1a1612" stroke-width="1.2"
        marker-start="url(#dp-diamond)"/>
  <text x="705" y="152" font-size="11.5" fill="#1a1612" text-anchor="middle">pizza</text>

  <!-- Pizza protocol -->
  <rect x="380" y="20" width="190" height="90" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="475" y="40" font-size="11" font-style="italic" fill="#8b1a1a" text-anchor="middle">&#171;Protocol&#187;</text>
  <text x="475" y="60" font-size="16" font-weight="bold" fill="#1a1612" text-anchor="middle">Pizza</text>
  <line x1="380" y1="70" x2="570" y2="70" stroke="#c8bfb0" stroke-width="1"/>
  <text x="475" y="87" font-size="12" fill="#1a1612" text-anchor="middle">+ cost: float</text>
  <text x="475" y="103" font-size="12" fill="#1a1612" text-anchor="middle">+ description: str</text>

  <!-- Margherita -->
  <rect x="20" y="190" width="170" height="90" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="105" y="212" font-size="15" font-weight="bold" fill="#1a1612" text-anchor="middle">Margherita</text>
  <line x1="20" y1="222" x2="190" y2="222" stroke="#c8bfb0" stroke-width="1"/>
  <text x="105" y="240" font-size="12" fill="#1a1612" text-anchor="middle">cost = 8.00</text>
  <text x="105" y="256" font-size="12" fill="#1a1612" text-anchor="middle">description = "Margherita"</text>

  <!-- Hawaiian -->
  <rect x="220" y="190" width="170" height="90" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="305" y="212" font-size="15" font-weight="bold" fill="#1a1612" text-anchor="middle">Hawaiian</text>
  <line x1="220" y1="222" x2="390" y2="222" stroke="#c8bfb0" stroke-width="1"/>
  <text x="305" y="240" font-size="12" fill="#1a1612" text-anchor="middle">cost = 9.50</text>
  <text x="305" y="256" font-size="12" fill="#1a1612" text-anchor="middle">description = "Hawaiian"</text>

  <!-- Topping -->
  <rect x="430" y="190" width="210" height="112" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="535" y="214" font-size="15" font-weight="bold" font-style="italic" fill="#1a1612" text-anchor="middle">Topping</text>
  <line x1="430" y1="224" x2="640" y2="224" stroke="#c8bfb0" stroke-width="1"/>
  <text x="535" y="242" font-size="12" fill="#1a1612" text-anchor="middle">pizza: Pizza</text>
  <text x="535" y="258" font-size="12" fill="#1a1612" text-anchor="middle">add_cost = 0.0</text>
  <text x="535" y="274" font-size="12" fill="#1a1612" text-anchor="middle">name = type(self).__name__</text>
  <text x="535" y="293" font-size="11" fill="#7a6e62" text-anchor="middle">cost, description forward to pizza</text>

  <!-- Garlic -->
  <rect x="350" y="350" width="170" height="74" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="435" y="372" font-size="15" font-weight="bold" fill="#1a1612" text-anchor="middle">Garlic</text>
  <line x1="350" y1="382" x2="520" y2="382" stroke="#c8bfb0" stroke-width="1"/>
  <text x="435" y="400" font-size="12" fill="#1a1612" text-anchor="middle">add_cost = 0.50</text>

  <!-- Olives -->
  <rect x="540" y="350" width="170" height="74" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="625" y="372" font-size="15" font-weight="bold" fill="#1a1612" text-anchor="middle">Olives</text>
  <line x1="540" y1="382" x2="710" y2="382" stroke="#c8bfb0" stroke-width="1"/>
  <text x="625" y="400" font-size="12" fill="#1a1612" text-anchor="middle">add_cost = 0.75</text>

  <!-- Feta -->
  <rect x="730" y="350" width="170" height="74" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="815" y="372" font-size="15" font-weight="bold" fill="#1a1612" text-anchor="middle">Feta</text>
  <line x1="730" y1="382" x2="900" y2="382" stroke="#c8bfb0" stroke-width="1"/>
  <text x="815" y="400" font-size="12" fill="#1a1612" text-anchor="middle">add_cost = 1.25</text>
</svg>
