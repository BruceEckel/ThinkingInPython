<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 390"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>Feta(Olives(Margherita())) as three nested layers: reading order.cost passes inward to Margherita's 8.00, and each topping adds its add_cost on the way back out, giving 8.75 and then 10.00</title>
  <defs>
    <marker id="dp-ink" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#1a1612" stroke="#1a1612" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
    <marker id="dp-back" viewBox="0 0 18 12" refX="17" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5,1.5 L17,6 L1.5,10.5" fill="none" stroke="#7a6e62" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="20" y="28" font-size="13" fill="#1a1612" text-anchor="start">order = Feta(Olives(Margherita()))</text>
  <rect x="10" y="140" width="90" height="115" fill="none" stroke="#1a1612" stroke-width="1.1" rx="4"/>
  <text x="20" y="158" font-size="10.5" fill="#7a6e62" text-anchor="start">caller</text>
  <text x="20" y="182" font-size="11" fill="#1a1612" text-anchor="start">order.cost</text>
  <text x="20" y="245" font-size="12" fill="#8b1a1a" font-weight="bold" text-anchor="start">10.00</text>
  <path d="M139,50 H711 Q715,50 715,54 V326 Q715,330 711,330 H139 Q135,330 135,326 V54 Q135,50 139,50 Z" fill="none" stroke="#1a1612" stroke-width="1.6"/>
  <text x="147" y="74" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">Feta</text>
  <text x="147" y="92" font-size="11" fill="#7a6e62" text-anchor="start">add_cost = 1.25</text>
  <rect x="147" y="140" width="125" height="115" fill="none" stroke="#1a1612" stroke-width="1.1" rx="4"/>
  <text x="157" y="158" font-size="10.5" fill="#7a6e62" text-anchor="start">cost</text>
  <text x="157" y="182" font-size="11" fill="#1a1612" text-anchor="start">self.pizza.cost</text>
  <text x="157" y="202" font-size="11" fill="#7a6e62" text-anchor="start">+ add_cost</text>
  <text x="157" y="245" font-size="12" fill="#8b1a1a" text-anchor="start">8.75 + 1.25</text>
  <path d="M309,80 H696 Q700,80 700,84 V311 Q700,315 696,315 H309 Q305,315 305,311 V84 Q305,80 309,80 Z" fill="none" stroke="#1a1612" stroke-width="1.6"/>
  <text x="317" y="104" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">Olives</text>
  <text x="317" y="122" font-size="11" fill="#7a6e62" text-anchor="start">add_cost = 0.75</text>
  <rect x="317" y="140" width="125" height="115" fill="none" stroke="#1a1612" stroke-width="1.1" rx="4"/>
  <text x="327" y="158" font-size="10.5" fill="#7a6e62" text-anchor="start">cost</text>
  <text x="327" y="182" font-size="11" fill="#1a1612" text-anchor="start">self.pizza.cost</text>
  <text x="327" y="202" font-size="11" fill="#7a6e62" text-anchor="start">+ add_cost</text>
  <text x="327" y="245" font-size="12" fill="#8b1a1a" text-anchor="start">8.00 + 0.75</text>
  <rect x="485" y="110" width="200" height="190" fill="none" stroke="#1a1612" stroke-width="1.3" rx="4"/>
  <text x="497" y="134" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">Margherita</text>
  <text x="497" y="182" font-size="12" fill="#1a1612" text-anchor="start">cost = 8.00</text>
  <text x="497" y="280" font-size="10.5" fill="#7a6e62" text-anchor="start">description = "Margherita"</text>
  <line x1="100" y1="178" x2="130.6" y2="178.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#dp-ink)"/>
  <line x1="147" y1="240" x2="104.0" y2="240.0" stroke="#7a6e62" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#dp-back)"/>
  <line x1="272" y1="178" x2="300.6" y2="178.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#dp-ink)"/>
  <line x1="317" y1="240" x2="276.0" y2="240.0" stroke="#7a6e62" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#dp-back)"/>
  <line x1="442" y1="178" x2="468.6" y2="178.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#dp-ink)"/>
  <line x1="485" y1="240" x2="446.0" y2="240.0" stroke="#7a6e62" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#dp-back)"/>
  <text x="20" y="362" font-size="11" fill="#7a6e62" text-anchor="start">prints</text>
  <text x="76" y="362" font-size="12.5" fill="#1a1612" text-anchor="start">Margherita + Olives + Feta: $10.00</text>
  <text x="20" y="382" font-size="10.5" fill="#7a6e62" text-anchor="start">description comes back the same way, each layer adding " + " and its name</text>
</svg>
