<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>Margherita and Hawaiian satisfy Pizza directly; Topping wraps a Pizza and also satisfies it, so Garlic, Olives, and Feta can wrap any pizza, including each other</title>
  <defs>
    <marker id="dp-tri" viewBox="0 0 18 12" refX="1" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L17.4,6 L1,11 Z" fill="none" stroke="#1a1612" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>
    <marker id="dp-tri-muted" viewBox="0 0 18 12" refX="1" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L17.4,6 L1,11 Z" fill="none" stroke="#7a6e62" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>
    <marker id="dp-diamond" viewBox="0 0 22 12" refX="21" refY="6"
            markerWidth="22" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,6 L11,1 L21,6 L11,11 Z" fill="none" stroke="#1a1612" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- realization: Margherita, Hawaiian, and Topping implement Pizza -->
  <line x1="120" y1="190" x2="247.6" y2="120.8" stroke="#7a6e62" stroke-width="1.2"
        stroke-dasharray="5,4" marker-end="url(#dp-tri-muted)"/>
  <line x1="335" y1="190" x2="340.5" y2="130.3" stroke="#7a6e62" stroke-width="1.2"
        stroke-dasharray="5,4" marker-end="url(#dp-tri-muted)"/>
  <line x1="575" y1="190" x2="471.7" y2="122.0" stroke="#7a6e62" stroke-width="1.2"
        stroke-dasharray="5,4" marker-end="url(#dp-tri-muted)"/>

  <!-- inheritance: Garlic, Olives, and Feta extend Topping -->
  <line x1="385" y1="350" x2="433.7" y2="314.6" stroke="#1a1612" stroke-width="1.2"
        marker-end="url(#dp-tri)"/>
  <line x1="575" y1="350" x2="575.0" y2="322.4" stroke="#1a1612" stroke-width="1.2"
        marker-end="url(#dp-tri)"/>
  <line x1="765" y1="350" x2="716.3" y2="314.6" stroke="#1a1612" stroke-width="1.2"
        marker-end="url(#dp-tri)"/>

  <!-- aggregation: Topping "has a" Pizza -->
  <path d="M722,246 C800,246 800,65 457,65" fill="none" stroke="#1a1612" stroke-width="1.2"
        marker-start="url(#dp-diamond)"/>
  <text x="772" y="160" font-size="11.5" fill="#1a1612" text-anchor="start">pizza</text>

  <!-- Pizza protocol -->
  <rect x="265" y="20" width="190" height="90" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="360" y="40" font-size="11" font-style="italic" fill="#8b1a1a" text-anchor="middle">&#171;Protocol&#187;</text>
  <text x="360" y="60" font-size="16" font-weight="bold" fill="#1a1612" text-anchor="middle">Pizza</text>
  <line x1="265" y1="70" x2="455" y2="70" stroke="#c8bfb0" stroke-width="1"/>
  <text x="360" y="87" font-size="12" fill="#1a1612" text-anchor="middle">+ cost: float</text>
  <text x="360" y="103" font-size="12" fill="#1a1612" text-anchor="middle">+ description: str</text>

  <!-- Margherita -->
  <rect x="20" y="190" width="200" height="90" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="120" y="212" font-size="15" font-weight="bold" fill="#1a1612" text-anchor="middle">Margherita</text>
  <line x1="20" y1="222" x2="220" y2="222" stroke="#c8bfb0" stroke-width="1"/>
  <text x="120" y="240" font-size="12" fill="#1a1612" text-anchor="middle">cost = 8.00</text>
  <text x="120" y="256" font-size="12" fill="#1a1612" text-anchor="middle">description = "Margherita"</text>

  <!-- Hawaiian -->
  <rect x="240" y="190" width="190" height="90" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="335" y="212" font-size="15" font-weight="bold" fill="#1a1612" text-anchor="middle">Hawaiian</text>
  <line x1="240" y1="222" x2="430" y2="222" stroke="#c8bfb0" stroke-width="1"/>
  <text x="335" y="240" font-size="12" fill="#1a1612" text-anchor="middle">cost = 9.50</text>
  <text x="335" y="256" font-size="12" fill="#1a1612" text-anchor="middle">description = "Hawaiian"</text>

  <!-- Topping -->
  <rect x="450" y="190" width="250" height="112" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="575" y="214" font-size="15" font-weight="bold" font-style="italic" fill="#1a1612" text-anchor="middle">Topping</text>
  <line x1="450" y1="224" x2="700" y2="224" stroke="#c8bfb0" stroke-width="1"/>
  <text x="575" y="242" font-size="12" fill="#1a1612" text-anchor="middle">pizza: Pizza</text>
  <text x="575" y="258" font-size="12" fill="#1a1612" text-anchor="middle">add_cost = 0.0</text>
  <text x="575" y="274" font-size="12" fill="#1a1612" text-anchor="middle">name = type(self).__name__</text>
  <text x="575" y="293" font-size="11" fill="#7a6e62" text-anchor="middle">cost, description forward to pizza</text>

  <!-- Garlic -->
  <rect x="300" y="350" width="170" height="74" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="385" y="372" font-size="15" font-weight="bold" fill="#1a1612" text-anchor="middle">Garlic</text>
  <line x1="300" y1="382" x2="470" y2="382" stroke="#c8bfb0" stroke-width="1"/>
  <text x="385" y="400" font-size="12" fill="#1a1612" text-anchor="middle">add_cost = 0.50</text>

  <!-- Olives -->
  <rect x="490" y="350" width="170" height="74" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="575" y="372" font-size="15" font-weight="bold" fill="#1a1612" text-anchor="middle">Olives</text>
  <line x1="490" y1="382" x2="660" y2="382" stroke="#c8bfb0" stroke-width="1"/>
  <text x="575" y="400" font-size="12" fill="#1a1612" text-anchor="middle">add_cost = 0.75</text>

  <!-- Feta -->
  <rect x="680" y="350" width="170" height="74" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="765" y="372" font-size="15" font-weight="bold" fill="#1a1612" text-anchor="middle">Feta</text>
  <line x1="680" y1="382" x2="850" y2="382" stroke="#c8bfb0" stroke-width="1"/>
  <text x="765" y="400" font-size="12" fill="#1a1612" text-anchor="middle">add_cost = 1.25</text>
</svg>
