<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 275"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>One assignment to celsius becomes one call on every listener in the broadcaster's list</title>
  <defs>
    <marker id="ob-tri" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#1a1612" stroke="#1a1612" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- the state change that starts the broadcast -->
  <line x1="155" y1="44" x2="155" y2="91.6" stroke="#1a1612" stroke-width="1.3"
        marker-end="url(#ob-tri)"/>
  <text x="168" y="78" font-size="11.5" fill="#1a1612">t.celsius = 25</text>

  <!-- the broadcaster -->
  <rect x="50" y="108" width="210" height="84" fill="none"
        stroke="#8b1a1a" stroke-width="1.6" rx="4"/>
  <text x="155" y="138" font-size="15" font-weight="bold" fill="#1a1612"
        text-anchor="middle">Thermometer</text>
  <text x="155" y="162" font-size="12" fill="#7a6e62"
        text-anchor="middle">announce(25)</text>
  <text x="155" y="180" font-size="11" fill="#7a6e62"
        text-anchor="middle">_listeners: [...]</text>

  <!-- one call per listener -->
  <line x1="263" y1="144" x2="423.7" y2="73" stroke="#1a1612" stroke-width="1.3"
        marker-end="url(#ob-tri)"/>
  <line x1="263" y1="150" x2="422.6" y2="150" stroke="#1a1612" stroke-width="1.3"
        marker-end="url(#ob-tri)"/>
  <line x1="263" y1="156" x2="423.7" y2="227" stroke="#1a1612" stroke-width="1.3"
        marker-end="url(#ob-tri)"/>
  <text x="350" y="140" font-size="11.5" fill="#8b1a1a"
        text-anchor="middle">listener(25)</text>

  <!-- the listeners: the two lambdas are in the listing, the dashed one is not -->
  <rect x="440" y="45" width="180" height="46" fill="none"
        stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="530" y="74" font-size="14" fill="#1a1612"
        text-anchor="middle">display</text>

  <rect x="440" y="127" width="180" height="46" fill="none"
        stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="530" y="156" font-size="14" fill="#1a1612"
        text-anchor="middle">alarm</text>

  <rect x="440" y="209" width="180" height="46" fill="none"
        stroke="#c8bfb0" stroke-width="1.3" rx="4" stroke-dasharray="4,3"/>
  <text x="530" y="238" font-size="14" fill="#7a6e62"
        text-anchor="middle">plot</text>
</svg>
