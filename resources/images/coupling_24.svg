<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 236"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>Every importer names config.py by its module name, and the import system hands each one the same instance</title>
  <defs>
    <marker id="c24-solid" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#1a1612" stroke="#1a1612" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
    <marker id="c24-hollow" viewBox="0 0 18 12" refX="1" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L17.4,6 L1,11 Z" fill="none" stroke="#1a1612" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>
    <marker id="c24-hollow-muted" viewBox="0 0 18 12" refX="1" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L17.4,6 L1,11 Z" fill="none" stroke="#7a6e62" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="10" y="20" font-size="13" font-weight="bold" font-style="italic" fill="#1a1612" text-anchor="start">Singleton</text>
  <line x1="10" y1="27" x2="440" y2="27" stroke="#c8bfb0" stroke-width="0.8"/>
  <rect x="202" y="108" width="170" height="38" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="4"/>
  <text x="287.0" y="124.2" font-size="12" font-weight="bold" fill="#1a1612" text-anchor="middle">config.py</text>
  <text x="287.0" y="139.2" font-size="9" fill="#7a6e62" text-anchor="middle">one instance per interpreter</text>
  <rect x="20" y="48" width="160" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="100.0" y="71.2" font-size="12" fill="#1a1612" text-anchor="middle">module_singleton.py</text>
  <rect x="20" y="168" width="160" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="100.0" y="191.2" font-size="12" fill="#1a1612" text-anchor="middle">shared_config.py</text>
  <line x1="145.7" y1="88.0" x2="186.7" y2="106.8" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c24-solid)"/>
  <text x="181.9" y="90.0" font-size="10.5" fill="#8b1a1a" text-anchor="middle">import</text>
  <line x1="145.7" y1="166.0" x2="186.7" y2="147.2" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c24-solid)"/>
  <text x="181.9" y="172.0" font-size="10.5" fill="#8b1a1a" text-anchor="middle">import</text>
  <text x="10" y="224" font-size="10.5" fill="#7a6e62" text-anchor="start">heavy edges: one per importer, all pointing at a name that does not change.</text>
  <line class="legend" x1="480" y1="60" x2="497.6" y2="60" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c24-solid)"/>
  <text x="518" y="64" font-size="10.5" fill="#7a6e62" text-anchor="start">names a concrete class</text>
  <rect x="482" y="72" width="26" height="16" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="3"/>
  <text x="518" y="84" font-size="10.5" fill="#7a6e62" text-anchor="start">does not change</text>
</svg>
