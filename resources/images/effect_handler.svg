<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 186"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>greet() holds the request ask(...). Execution goes to the with fun ask handler in main(), which holds the calls to print() and readline(): the prompt goes to the console, a line comes back, and execution returns to greet() with the line.</title>
  <defs>
    <marker id="ink" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#1a1612" stroke="#1a1612" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
    <marker id="ink_open" viewBox="0 0 18 12" refX="17" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5,1.5 L17,6 L1.5,10.5" fill="none" stroke="#1a1612" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="20" y="16" width="150" height="154" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="95" y="38" font-size="15" fill="#1a1612" font-weight="bold" text-anchor="middle">greet()</text>
  <rect x="40" y="64" width="110" height="28" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="3"/>
  <text x="95" y="83" font-size="13" fill="#1a1612" text-anchor="middle">ask(...)</text>
  <rect x="300" y="16" width="160" height="154" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="380" y="38" font-size="15" fill="#1a1612" font-weight="bold" text-anchor="middle">handler</text>
  <text x="380" y="53" font-size="11" fill="#7a6e62" text-anchor="middle">in main()</text>
  <rect x="325" y="64" width="110" height="28" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="3"/>
  <text x="380" y="83" font-size="13" fill="#1a1612" text-anchor="middle">print()</text>
  <rect x="325" y="128" width="110" height="28" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="3"/>
  <text x="380" y="147" font-size="13" fill="#1a1612" text-anchor="middle">readline()</text>
  <rect x="540" y="54" width="120" height="112" fill="#eeeeee" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="600" y="106" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="middle">console</text>
  <text x="600" y="124" font-size="10.5" fill="#7a6e62" text-anchor="middle">outside world</text>
  <line x1="170" y1="78" x2="283.6" y2="78" stroke="#1a1612" stroke-width="1.3" marker-end="url(#ink)"/>
  <text x="235" y="68" font-size="12" fill="#1a1612" text-anchor="middle">request</text>
  <text x="235" y="105" font-size="10.5" fill="#7a6e62" text-anchor="middle">greet() pauses</text>
  <line x1="300" y1="142" x2="174" y2="142" stroke="#1a1612" stroke-width="1.3" marker-end="url(#ink_open)"/>
  <text x="235" y="132" font-size="12" fill="#1a1612" text-anchor="middle">the line</text>
  <line x1="460" y1="78" x2="523.6" y2="78" stroke="#1a1612" stroke-width="1.3" marker-end="url(#ink)"/>
  <text x="500" y="68" font-size="12" fill="#1a1612" text-anchor="middle">prompt</text>
  <line x1="540" y1="142" x2="476.4" y2="142" stroke="#1a1612" stroke-width="1.3" marker-end="url(#ink)"/>
  <text x="500" y="132" font-size="12" fill="#1a1612" text-anchor="middle">a line</text>
</svg>
