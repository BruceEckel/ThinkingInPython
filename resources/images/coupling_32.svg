<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 236"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>Paper, Scissors, and Rock each define an eval method for every item and call one through Any, so a fourth item edits all three</title>
  <defs>
    <marker id="c32-solid" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#1a1612" stroke="#1a1612" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
    <marker id="c32-hollow" viewBox="0 0 18 12" refX="1" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L17.4,6 L1,11 Z" fill="none" stroke="#1a1612" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>
    <marker id="c32-hollow-muted" viewBox="0 0 18 12" refX="1" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L17.4,6 L1,11 Z" fill="none" stroke="#7a6e62" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="10" y="20" font-size="13" font-weight="bold" font-style="italic" fill="#1a1612" text-anchor="start">Multiple Dispatching</text>
  <line x1="10" y1="27" x2="440" y2="27" stroke="#c8bfb0" stroke-width="0.8"/>
  <rect x="20" y="48" width="90" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="65.0" y="71.2" font-size="12" fill="#1a1612" text-anchor="middle">Paper</text>
  <rect x="20" y="168" width="90" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="65.0" y="191.2" font-size="12" fill="#1a1612" text-anchor="middle">Scissors</text>
  <rect x="334" y="108" width="90" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="379.0" y="131.2" font-size="12" fill="#1a1612" text-anchor="middle">Rock</text>
  <rect x="168" y="108" width="118" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4" stroke-dasharray="4,3"/>
  <text x="227.0" y="124.2" font-size="12" fill="#7a6e62" text-anchor="middle">eval_*()</text>
  <text x="227.0" y="139.2" font-size="9" fill="#7a6e62" text-anchor="middle">undeclared</text>
  <line x1="109.9" y1="90.0" x2="152.4" y2="105.8" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c32-solid)"/>
  <line x1="114.1" y1="78.8" x2="166.8" y2="98.3" stroke="#7a6e62" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#c32-hollow-muted)"/>
  <line x1="109.9" y1="164.0" x2="152.4" y2="148.2" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c32-solid)"/>
  <line x1="114.1" y1="175.2" x2="166.8" y2="155.7" stroke="#7a6e62" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#c32-hollow-muted)"/>
  <line x1="332.0" y1="121.0" x2="302.4" y2="121.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c32-solid)"/>
  <line x1="332.0" y1="133.0" x2="306.4" y2="133.0" stroke="#7a6e62" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#c32-hollow-muted)"/>
  <text x="10" y="224" font-size="10.5" fill="#7a6e62" text-anchor="start">heavy edges: 0. The coupling is in the method names eval_paper(), eval_scissors(), and eval_rock().</text>
  <line x1="480" y1="60" x2="497.6" y2="60" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c32-solid)"/>
  <text x="518" y="64" font-size="10.5" fill="#7a6e62" text-anchor="start">names a concrete class</text>
  <line x1="480" y1="80" x2="497.6" y2="80" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c32-solid)"/>
  <text x="518" y="84" font-size="10.5" fill="#7a6e62" text-anchor="start">names an interface</text>
  <line x1="480" y1="100" x2="493.6" y2="100" stroke="#7a6e62" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#c32-hollow-muted)"/>
  <text x="518" y="104" font-size="10.5" fill="#7a6e62" text-anchor="start">satisfies it</text>
  <line x1="480" y1="120" x2="493.6" y2="120" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c32-hollow)"/>
  <text x="518" y="124" font-size="10.5" fill="#7a6e62" text-anchor="start">inherits its internals</text>
  <rect x="482" y="132" width="26" height="16" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="3"/>
  <text x="518" y="144" font-size="10.5" fill="#7a6e62" text-anchor="start">kept free of change</text>
</svg>
