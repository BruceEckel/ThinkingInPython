  <rect x="120" y="150" width="90" height="34" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="165.0" y="170.7" font-size="10.5" fill="#1a1612" text-anchor="middle">HtmlWriter</text>
  <rect x="230" y="150" width="100" height="34" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4" stroke-dasharray="4,3"/>
  <text x="280.0" y="170.7" font-size="10.5" fill="#7a6e62" text-anchor="middle">MdWriter</text>
  <line x1="92.0" y1="68.0" x2="113.6" y2="68" stroke="#1a1612" stroke-width="2.8" marker-end="url(#rc-solid)"/>
  <line x1="150.8" y1="88.0" x2="111.8" y2="136.3" stroke="#1a1612" stroke-width="2.8" marker-end="url(#rc-solid)"/>
  <line x1="173.0" y1="88.0" x2="168.4" y2="133.7" stroke="#1a1612" stroke-width="2.8" marker-end="url(#rc-solid)"/>
  <line x1="196.2" y1="88.0" x2="248.7" y2="137.5" stroke="#8b1a1a" stroke-width="2.8" marker-end="url(#rc-solid-red)"/>
  <line x1="51.0" y1="88.0" x2="53.3" y2="133.6" stroke="#1a1612" stroke-width="2.8" marker-end="url(#rc-solid)"/>
  <line x1="73.2" y1="88.0" x2="131.2" y2="137.9" stroke="#1a1612" stroke-width="2.8" marker-end="url(#rc-solid)"/>
  <path d="M92,86.1 Q167.2,88.3 222.2,137.5" fill="none" stroke="#8b1a1a" stroke-width="2.8" marker-end="url(#rc-solid-red)"/>
  <line x1="350" y1="10" x2="350" y2="200" stroke="#c8bfb0" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="370" y="22" font-size="13" font-weight="bold" fill="#1a1612" text-anchor="start">Report names a protocol</text>
  <rect x="370" y="50" width="80" height="36" fill="#8b1a1a" fill-opacity="0.13" rx="4"/>
  <rect x="370" y="50" width="80" height="36" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="4"/>
  <text x="410.0" y="72.2" font-size="12" font-weight="bold" fill="#1a1612" text-anchor="middle">main</text>
  <rect x="490" y="50" width="90" height="36" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="535.0" y="72.2" font-size="12" fill="#1a1612" text-anchor="middle">Report</text>
  <rect x="370" y="150" width="90" height="34" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="415.0" y="170.7" font-size="10.5" fill="#1a1612" text-anchor="middle">PdfWriter</text>
  <rect x="480" y="150" width="90" height="34" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="525.0" y="170.7" font-size="10.5" fill="#1a1612" text-anchor="middle">HtmlWriter</text>
  <rect x="590" y="150" width="100" height="34" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4" stroke-dasharray="4,3"/>
  <text x="640.0" y="170.7" font-size="10.5" fill="#7a6e62" text-anchor="middle">MdWriter</text>
  <line x1="452.0" y1="68.0" x2="473.6" y2="68" stroke="#1a1612" stroke-width="2.8" marker-end="url(#rc-solid)"/>
  <rect x="610" y="50" width="80" height="36" fill="none" stroke="#7a6e62" stroke-width="1.3" rx="12"/>
  <text x="650.0" y="72.2" font-size="12" fill="#7a6e62" text-anchor="middle">Writer</text>
  <line x1="582.0" y1="68.0" x2="593.6" y2="68" stroke="#1a1612" stroke-width="1.3" marker-end="url(#rc-solid)"/>
  <line x1="460.1" y1="148.0" x2="590.9" y2="92.9" stroke="#7a6e62" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#rc-hollow-muted)"/>
  <line x1="549.0" y1="148.0" x2="609.3" y2="100.2" stroke="#7a6e62" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#rc-hollow-muted)"/>
  <line x1="641.9" y1="148.0" x2="646.1" y2="106.3" stroke="#7a6e62" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#rc-hollow-muted)"/>
  <line x1="411.0" y1="88.0" x2="413.3" y2="133.6" stroke="#1a1612" stroke-width="2.8" marker-end="url(#rc-solid)"/>
  <line x1="433.2" y1="88.0" x2="468.6" y2="136" stroke="#1a1612" stroke-width="2.8" marker-end="url(#rc-solid)"/>
  <path d="M452,86.1 Q527.2,88.3 582.2,137.5" fill="none" stroke="#8b1a1a" stroke-width="2.8" marker-end="url(#rc-solid-red)"/>
  <text x="10" y="222" font-size="10.5" fill="#7a6e62" text-anchor="start">Shaded: the parts whose source changes when MdWriter is added. Red: the edges that change adds.</text>
</svg>
