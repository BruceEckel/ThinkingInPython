<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 234"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>Adding a writer reaches two parts when Report names each writer, and one when Report names a protocol</title>
  <defs>
    <marker id="rc-solid" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#1a1612" stroke="#1a1612" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
    <marker id="rc-solid-red" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#8b1a1a" stroke="#8b1a1a" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
    <marker id="rc-hollow-muted" viewBox="0 0 18 12" refX="1" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L17.4,6 L1,11 Z" fill="none" stroke="#7a6e62" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="10" y="22" font-size="13" font-weight="bold" fill="#1a1612" text-anchor="start">Report names each writer</text>
  <rect x="10" y="50" width="80" height="36" fill="#8b1a1a" fill-opacity="0.13" rx="4"/>
  <rect x="10" y="50" width="80" height="36" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="4"/>
  <text x="50.0" y="72.2" font-size="12" font-weight="bold" fill="#1a1612" text-anchor="middle">main</text>
  <rect x="130" y="50" width="90" height="36" fill="#8b1a1a" fill-opacity="0.13" rx="4"/>
  <rect x="130" y="50" width="90" height="36" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="4"/>
  <text x="175.0" y="72.2" font-size="12" font-weight="bold" fill="#1a1612" text-anchor="middle">Report</text>
  <rect x="10" y="150" width="90" height="34" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
