<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 234"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>Adding a writer reaches two parts when Report names each writer, and one when Report names a protocol</title>
  <defs>
    <marker id="rc-solid" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1a1612" stroke="#1a1612" stroke-width="1"/>
    </marker>
    <marker id="rc-hollow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f5f0e8" stroke="#1a1612" stroke-width="1"/>
    </marker>
  </defs>
  <text x="10" y="22" font-size="13" font-weight="bold" fill="#1a1612" text-anchor="start">Report names each writer</text>
  <rect x="10" y="50" width="80" height="36" fill="#8b1a1a" fill-opacity="0.13" rx="4"/>
  <rect x="10" y="50" width="80" height="36" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="4"/>
  <text x="50.0" y="72.2" font-size="12" font-weight="bold" fill="#1a1612" text-anchor="middle">main</text>
  <rect x="130" y="50" width="90" height="36" fill="#8b1a1a" fill-opacity="0.13" rx="4"/>
  <rect x="130" y="50" width="90" height="36" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="4"/>
  <text x="175.0" y="72.2" font-size="12" font-weight="bold" fill="#1a1612" text-anchor="middle">Report</text>
  <rect x="10" y="150" width="90" height="34" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="55.0" y="170.7" font-size="10.5" fill="#1a1612" text-anchor="middle">PdfWriter</text>
  <rect x="120" y="150" width="90" height="34" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="165.0" y="170.7" font-size="10.5" fill="#1a1612" text-anchor="middle">HtmlWriter</text>
  <rect x="230" y="150" width="100" height="34" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4" stroke-dasharray="4,3"/>
  <text x="280.0" y="170.7" font-size="10.5" fill="#7a6e62" text-anchor="middle">MdWriter</text>
  <line x1="92.0" y1="68.0" x2="126.0" y2="68.0" stroke="#1a1612" stroke-width="2.8" marker-end="url(#rc-solid)"/>
  <line x1="150.8" y1="88.0" x2="80.5" y2="146.0" stroke="#1a1612" stroke-width="2.8" marker-end="url(#rc-solid)"/>
  <line x1="173.0" y1="88.0" x2="167.1" y2="146.0" stroke="#1a1612" stroke-width="2.8" marker-end="url(#rc-solid)"/>
  <line x1="196.2" y1="88.0" x2="257.7" y2="146.0" stroke="#8b1a1a" stroke-width="2.8" marker-end="url(#rc-solid)"/>
  <line x1="51.0" y1="88.0" x2="53.9" y2="146.0" stroke="#1a1612" stroke-width="2.8" marker-end="url(#rc-solid)"/>
  <line x1="73.2" y1="88.0" x2="140.6" y2="146.0" stroke="#1a1612" stroke-width="2.8" marker-end="url(#rc-solid)"/>
  <path d="M92.0,86.1 Q173.5,88.5 231.2,146.0" fill="none" stroke="#8b1a1a" stroke-width="2.8" marker-end="url(#rc-solid)"/>
  <line x1="350" y1="10" x2="350" y2="200" stroke="#c8bfb0" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="370" y="22" font-size="13" font-weight="bold" fill="#1a1612" text-anchor="start">Report names a protocol</text>
  <rect x="370" y="50" width="80" height="36" fill="#8b1a1a" fill-opacity="0.13" rx="4"/>
  <rect x="370" y="50" width="80" height="36" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="4"/>
  <text x="410.0" y="72.2" font-size="12" font-weight="bold" fill="#1a1612" text-anchor="middle">main</text>
  <rect x="490" y="50" width="90" height="36" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="535.0" y="72.2" font-size="12" fill="#1a1612" text-anchor="middle">Report</text>
  <rect x="370" y="150" width="90" height="34" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="415.0" y="170.7" font-size="10.5" fill="#1a1612" text-anchor="middle">PdfWriter</text>
  <rect x="480" y="150" width="90" height="34" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="525.0" y="170.7" font-size="10.5" fill="#1a1612" text-anchor="middle">HtmlWriter</text>
  <rect x="590" y="150" width="100" height="34" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4" stroke-dasharray="4,3"/>
  <text x="640.0" y="170.7" font-size="10.5" fill="#7a6e62" text-anchor="middle">MdWriter</text>
  <line x1="452.0" y1="68.0" x2="486.0" y2="68.0" stroke="#1a1612" stroke-width="2.8" marker-end="url(#rc-solid)"/>
  <rect x="610" y="50" width="80" height="36" fill="none" stroke="#7a6e62" stroke-width="1.3" rx="12"/>
  <text x="650.0" y="72.2" font-size="12" fill="#7a6e62" text-anchor="middle">Writer</text>
  <line x1="582.0" y1="68.0" x2="606.0" y2="68.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#rc-solid)"/>
  <line x1="460.1" y1="148.0" x2="606.0" y2="86.5" stroke="#7a6e62" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#rc-hollow)"/>
  <line x1="549.0" y1="148.0" x2="622.2" y2="90.0" stroke="#7a6e62" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#rc-hollow)"/>
  <line x1="641.9" y1="148.0" x2="647.8" y2="90.0" stroke="#7a6e62" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#rc-hollow)"/>
  <line x1="411.0" y1="88.0" x2="413.9" y2="146.0" stroke="#1a1612" stroke-width="2.8" marker-end="url(#rc-solid)"/>
  <line x1="433.2" y1="88.0" x2="500.6" y2="146.0" stroke="#1a1612" stroke-width="2.8" marker-end="url(#rc-solid)"/>
  <path d="M452.0,86.1 Q533.5,88.5 591.2,146.0" fill="none" stroke="#8b1a1a" stroke-width="2.8" marker-end="url(#rc-solid)"/>
  <text x="10" y="222" font-size="10.5" fill="#7a6e62" text-anchor="start">Shaded: the parts whose source changes when MdWriter is added. Red: the edges that change adds.</text>
</svg>
