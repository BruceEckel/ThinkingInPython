<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 514"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>Command, Strategy, and Chain of Responsibility as function objects: one place chooses the callables, and an unchanging call site calls them knowing only their signature</title>
  <defs>
    <marker id="fo-ink" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#1a1612" stroke="#1a1612" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
  </defs>
  <path d="M144,8 H300 V510 H144 Z" fill="#eeeeee" stroke="none" stroke-width="1.6"/>
  <text x="222" y="26" font-size="11" fill="#7a6e62" text-anchor="middle">one place chooses</text>
  <text x="446" y="26" font-size="11" fill="#7a6e62" text-anchor="middle">another place calls</text>
  <text x="556" y="26" font-size="11" fill="#7a6e62" text-anchor="start">result</text>
  <line x1="16" y1="40" x2="714" y2="40" stroke="#c8bfb0" stroke-width="0.8"/>
  <text x="20" y="68" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">Command</text>
  <text x="20" y="88" font-size="11.5" fill="#8b1a1a" text-anchor="start">defers what</text>
  <text x="20" y="108" font-size="10.5" fill="#7a6e62" text-anchor="start">store the</text>
  <text x="20" y="122" font-size="10.5" fill="#7a6e62" text-anchor="start">actions and</text>
  <text x="20" y="136" font-size="10.5" fill="#7a6e62" text-anchor="start">run them later</text>
  <path d="M156,52 H288 Q292,52 292,56 V180 Q292,184 288,184 H156 Q152,184 152,180 V56 Q152,52 156,52 Z" fill="none" stroke="#c8bfb0" stroke-width="1"/>
  <text x="160" y="70" font-size="10" fill="#7a6e62" text-anchor="start">macro</text>
  <rect x="168" y="80" width="108" height="26" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="222" y="97" font-size="11" fill="#1a1612" text-anchor="middle">no_more</text>
  <rect x="168" y="114" width="108" height="26" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="222" y="131" font-size="11" fill="#1a1612" text-anchor="middle">ceased</text>
  <rect x="168" y="148" width="108" height="26" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="222" y="165" font-size="11" fill="#1a1612" text-anchor="middle">fjords</text>
  <line x1="292" y1="113" x2="339.6" y2="113.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#fo-ink)"/>
  <text x="324" y="105" font-size="10" fill="#1a1612" text-anchor="middle">later</text>
  <rect x="356" y="75" width="180" height="76" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="4"/>
  <text x="366" y="109" font-size="10" fill="#7a6e62" text-anchor="start">for command in macro:</text>
  <text x="392.4" y="125" font-size="11" fill="#8b1a1a" font-weight="bold" text-anchor="start">command()</text>
  <text x="446" y="167" font-size="10" fill="#7a6e62" text-anchor="middle">sees only Command</text>
  <text x="556" y="97" font-size="10.5" fill="#1a1612" text-anchor="start">This parrot is no more.</text>
  <text x="556" y="131" font-size="10.5" fill="#1a1612" text-anchor="start">It has ceased to be.</text>
  <text x="556" y="165" font-size="10.5" fill="#1a1612" text-anchor="start">It's pining for the fjords.</text>
  <line x1="16" y1="198" x2="714" y2="198" stroke="#c8bfb0" stroke-width="0.8"/>
  <text x="20" y="226" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">Strategy</text>
  <text x="20" y="246" font-size="11.5" fill="#8b1a1a" text-anchor="start">defers how</text>
  <text x="20" y="266" font-size="10.5" fill="#7a6e62" text-anchor="start">the caller</text>
  <text x="20" y="280" font-size="10.5" fill="#7a6e62" text-anchor="start">passes the</text>
  <text x="20" y="294" font-size="10.5" fill="#7a6e62" text-anchor="start">algorithm</text>
  <text x="160" y="228" font-size="10" fill="#7a6e62" text-anchor="start">one per call</text>
  <rect x="168" y="238" width="108" height="26" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="222" y="255" font-size="11" fill="#1a1612" text-anchor="middle">bisection</text>
  <rect x="168" y="272" width="108" height="26" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="222" y="289" font-size="11" fill="#1a1612" text-anchor="middle">newton</text>
  <rect x="168" y="306" width="108" height="26" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="222" y="323" font-size="11" fill="#1a1612" text-anchor="middle">secant</text>
  <line x1="276" y1="251" x2="339.6" y2="255.8" stroke="#1a1612" stroke-width="1.3" marker-end="url(#fo-ink)"/>
  <line x1="276" y1="285" x2="339.8" y2="273.8" stroke="#1a1612" stroke-width="1.3" marker-end="url(#fo-ink)"/>
  <line x1="276" y1="319" x2="340.9" y2="291.4" stroke="#1a1612" stroke-width="1.3" marker-end="url(#fo-ink)"/>
  <text x="316" y="241" font-size="10" fill="#1a1612" text-anchor="middle">any one</text>
  <rect x="356" y="233" width="180" height="76" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="4"/>
  <text x="366" y="267" font-size="10" fill="#7a6e62" text-anchor="start">def solve(..., finder):</text>
  <text x="392.4" y="283" font-size="11" fill="#8b1a1a" font-weight="bold" text-anchor="start">finder(f, a, b)</text>
  <text x="446" y="325" font-size="10" fill="#7a6e62" text-anchor="middle">sees only RootFinder</text>
  <text x="556" y="228" font-size="10" fill="#7a6e62" text-anchor="start">solve(f, 0.0, 2.0, finder)</text>
  <text x="556" y="255" font-size="10.5" fill="#1a1612" text-anchor="start">1.414214</text>
  <text x="556" y="289" font-size="10.5" fill="#1a1612" text-anchor="start">1.414214</text>
  <text x="556" y="323" font-size="10.5" fill="#1a1612" text-anchor="start">1.414214</text>
  <line x1="16" y1="356" x2="714" y2="356" stroke="#c8bfb0" stroke-width="0.8"/>
  <text x="20" y="384" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">Chain of</text>
  <text x="20" y="400" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">Responsibility</text>
  <text x="20" y="420" font-size="11.5" fill="#8b1a1a" text-anchor="start">defers which</text>
  <text x="20" y="440" font-size="10.5" fill="#7a6e62" text-anchor="start">tries each</text>
  <text x="20" y="454" font-size="10.5" fill="#7a6e62" text-anchor="start">until one</text>
  <text x="20" y="468" font-size="10.5" fill="#7a6e62" text-anchor="start">succeeds</text>
  <path d="M156,368 H288 Q292,368 292,372 V496 Q292,500 288,500 H156 Q152,500 152,496 V372 Q152,368 156,368 Z" fill="none" stroke="#c8bfb0" stroke-width="1"/>
  <text x="160" y="386" font-size="10" fill="#7a6e62" text-anchor="start">chain</text>
  <rect x="168" y="396" width="108" height="26" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="222" y="413" font-size="11" fill="#1a1612" text-anchor="middle">bisection</text>
  <rect x="168" y="430" width="108" height="26" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="222" y="447" font-size="11" fill="#1a1612" text-anchor="middle">secant</text>
  <rect x="168" y="464" width="108" height="26" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="222" y="481" font-size="11" fill="#7a6e62" text-anchor="middle">newton</text>
  <line x1="292" y1="429" x2="339.6" y2="429.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#fo-ink)"/>
  <text x="324" y="421" font-size="10" fill="#1a1612" text-anchor="middle">in order</text>
  <rect x="356" y="391" width="180" height="76" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="4"/>
  <text x="366" y="417" font-size="10" fill="#7a6e62" text-anchor="start">def solve(..., chain):</text>
  <text x="390" y="433" font-size="10" fill="#7a6e62" text-anchor="start">for finder in chain:</text>
  <text x="418.8" y="449" font-size="11" fill="#8b1a1a" font-weight="bold" text-anchor="start">finder(f, a, b)</text>
  <text x="446" y="483" font-size="10" fill="#7a6e62" text-anchor="middle">sees only RootFinder</text>
  <text x="556" y="386" font-size="10" fill="#7a6e62" text-anchor="start">solve(f, 1.0, 1.3, chain)</text>
  <text x="556" y="413" font-size="10.5" fill="#7a6e62" text-anchor="start">bisection: None</text>
  <text x="556" y="447" font-size="10.5" fill="#1a1612" text-anchor="start">secant: 1.414214</text>
  <text x="556" y="481" font-size="10.5" fill="#7a6e62" text-anchor="start">newton: never runs</text>
  <path d="M657.5,404 L667.5,414 M657.5,414 L667.5,404" stroke="#8b1a1a" stroke-width="2" fill="none"/>
</svg>
