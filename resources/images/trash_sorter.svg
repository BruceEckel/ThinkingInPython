<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 460"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>Each Trash subclass registers itself, and sorting keys the bins dict by type(t) instead of naming any material</title>
  <defs>
    <marker id="ts-tri" viewBox="0 0 18 12" refX="1" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L17.4,6 L1,11 Z" fill="none" stroke="#1a1612" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>
    <marker id="ts-arrow" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#1a1612" stroke="#1a1612" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- inheritance: Aluminum, Paper, Glass, Cardboard extend Trash -->
  <line x1="130" y1="190" x2="388.9" y2="139.2" stroke="#1a1612" stroke-width="1.2" marker-end="url(#ts-tri)"/>
  <line x1="360" y1="190" x2="437.9" y2="144.3" stroke="#1a1612" stroke-width="1.2" marker-end="url(#ts-tri)"/>
  <line x1="590" y1="190" x2="513.1" y2="144.4" stroke="#1a1612" stroke-width="1.2" marker-end="url(#ts-tri)"/>
  <line x1="820" y1="190" x2="562.1" y2="139.2" stroke="#1a1612" stroke-width="1.2" marker-end="url(#ts-tri)"/>

  <!-- fan-in: each subclass sorts by type(t) into one dict of bins -->
  <line x1="130" y1="260" x2="130" y2="300" stroke="#7a6e62" stroke-width="1"/>
  <line x1="360" y1="260" x2="360" y2="300" stroke="#7a6e62" stroke-width="1"/>
  <line x1="590" y1="260" x2="590" y2="300" stroke="#7a6e62" stroke-width="1"/>
  <line x1="820" y1="260" x2="820" y2="300" stroke="#7a6e62" stroke-width="1"/>
  <line x1="130" y1="300" x2="820" y2="300" stroke="#1a1612" stroke-width="1.3"/>
  <line x1="475" y1="300" x2="475" y2="333.6" stroke="#1a1612" stroke-width="1.3" marker-end="url(#ts-arrow)"/>
  <text x="485" y="328" font-size="11.5" fill="#1a1612">type(t)</text>

  <!-- Trash -->
  <rect x="365" y="20" width="220" height="112" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="475" y="44" font-size="16" font-weight="bold" fill="#1a1612" text-anchor="middle">Trash</text>
  <line x1="365" y1="54" x2="585" y2="54" stroke="#c8bfb0" stroke-width="1"/>
  <text x="475" y="72" font-size="12" fill="#1a1612" text-anchor="middle">weight: float</text>
  <text x="475" y="88" font-size="12" fill="#1a1612" text-anchor="middle">value: ClassVar[float]</text>
  <text x="475" y="104" font-size="12" fill="#1a1612" text-anchor="middle">registry: ClassVar[dict]</text>
  <text x="475" y="120" font-size="12" fill="#1a1612" text-anchor="middle">+ create(name, weight)</text>

  <!-- Aluminum -->
  <rect x="20" y="190" width="220" height="70" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="130" y="212" font-size="14.5" font-weight="bold" fill="#1a1612" text-anchor="middle">Aluminum</text>
  <line x1="20" y1="222" x2="240" y2="222" stroke="#c8bfb0" stroke-width="1"/>
  <text x="130" y="244" font-size="12" fill="#1a1612" text-anchor="middle">value: ClassVar[float] = 1.67</text>
  <!-- Paper -->
  <rect x="250" y="190" width="220" height="70" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="360" y="212" font-size="14.5" font-weight="bold" fill="#1a1612" text-anchor="middle">Paper</text>
  <line x1="250" y1="222" x2="470" y2="222" stroke="#c8bfb0" stroke-width="1"/>
  <text x="360" y="244" font-size="12" fill="#1a1612" text-anchor="middle">value: ClassVar[float] = 0.10</text>
  <!-- Glass -->
  <rect x="480" y="190" width="220" height="70" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="590" y="212" font-size="14.5" font-weight="bold" fill="#1a1612" text-anchor="middle">Glass</text>
  <line x1="480" y1="222" x2="700" y2="222" stroke="#c8bfb0" stroke-width="1"/>
  <text x="590" y="244" font-size="12" fill="#1a1612" text-anchor="middle">value: ClassVar[float] = 0.23</text>
  <!-- Cardboard -->
  <rect x="710" y="190" width="220" height="70" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="820" y="212" font-size="14.5" font-weight="bold" fill="#1a1612" text-anchor="middle">Cardboard</text>
  <line x1="710" y1="222" x2="930" y2="222" stroke="#c8bfb0" stroke-width="1"/>
  <text x="820" y="244" font-size="12" fill="#1a1612" text-anchor="middle">value: ClassVar[float] = 0.79</text>

  <!-- Bins -->
  <rect x="380" y="350" width="190" height="90" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="475" y="373" font-size="14.5" font-weight="bold" fill="#1a1612" text-anchor="middle">bins</text>
  <line x1="380" y1="383" x2="570" y2="383" stroke="#c8bfb0" stroke-width="1"/>
  <text x="475" y="403" font-size="11.5" fill="#1a1612" text-anchor="middle">type[Trash] -&gt;</text>
  <text x="475" y="419" font-size="11.5" fill="#1a1612" text-anchor="middle">list[Trash]</text>
</svg>
