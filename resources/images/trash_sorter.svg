<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 395"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>The four lines of plastic.dat pass through Trash.create(), which reads Trash.registry, and bins[type(t)], which files each piece under its exact class; the new Plastic class registers itself and gets its own bin with no edit to the parser or the sorter</title>
  <defs>
    <marker id="ts-ink" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#1a1612" stroke="#1a1612" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
    <marker id="ts-red" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#8b1a1a" stroke="#8b1a1a" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
    <marker id="ts-muted" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#7a6e62" stroke="#7a6e62" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="490" y="28" width="230" height="48" fill="none" stroke="#8b1a1a" stroke-width="1.3" rx="4"/>
  <text x="500" y="47" font-size="10.5" fill="#8b1a1a" text-anchor="start">class Plastic(Trash):</text>
  <text x="512" y="64" font-size="10" fill="#8b1a1a" text-anchor="start">value: ClassVar[float] = 0.15</text>
  <text x="490" y="94" font-size="10" fill="#7a6e62" text-anchor="start">__init_subclass__()</text>
  <text x="490" y="108" font-size="10" fill="#7a6e62" text-anchor="start">adds it to the registry</text>
  <rect x="102" y="20" width="310" height="72" fill="none" stroke="#1a1612" stroke-width="1.1" rx="4"/>
  <text x="114" y="42" font-size="11.5" fill="#1a1612" font-weight="bold" text-anchor="start">Trash.registry</text>
  <rect x="114" y="56" width="60" height="24" fill="none" stroke="#c8bfb0" stroke-width="1.1" rx="4"/>
  <text x="144" y="72" font-size="10" fill="#1a1612" text-anchor="middle">Aluminum</text>
  <rect x="180" y="56" width="42" height="24" fill="none" stroke="#c8bfb0" stroke-width="1.1" rx="4"/>
  <text x="201" y="72" font-size="10" fill="#1a1612" text-anchor="middle">Paper</text>
  <rect x="228" y="56" width="42" height="24" fill="none" stroke="#c8bfb0" stroke-width="1.1" rx="4"/>
  <text x="249" y="72" font-size="10" fill="#1a1612" text-anchor="middle">Glass</text>
  <rect x="276" y="56" width="66" height="24" fill="none" stroke="#c8bfb0" stroke-width="1.1" rx="4"/>
  <text x="309" y="72" font-size="10" fill="#1a1612" text-anchor="middle">Cardboard</text>
  <rect x="348" y="56" width="54" height="24" fill="none" stroke="#8b1a1a" stroke-width="1.3" rx="4"/>
  <text x="375" y="72" font-size="10" fill="#8b1a1a" text-anchor="middle">Plastic</text>
  <line x1="490" y1="52" x2="428.4" y2="52.0" stroke="#8b1a1a" stroke-width="1.3" marker-end="url(#ts-red)"/>
  <text x="20" y="148" font-size="11.5" fill="#1a1612" font-weight="bold" text-anchor="start">plastic.dat</text>
  <text x="257" y="148" font-size="11.5" fill="#1a1612" font-weight="bold" text-anchor="middle">Trash.create()</text>
  <text x="257" y="163" font-size="10" fill="#7a6e62" text-anchor="middle">registry[name](weight)</text>
  <text x="441" y="148" font-size="11.5" fill="#1a1612" font-weight="bold" text-anchor="middle">bins[type(t)].append(t)</text>
  <text x="441" y="163" font-size="10" fill="#7a6e62" text-anchor="middle">no case per material</text>
  <line x1="257" y1="132" x2="257.0" y2="108.4" stroke="#7a6e62" stroke-width="1.3" marker-end="url(#ts-muted)"/>
  <rect x="20" y="181" width="110" height="176" fill="none" stroke="#c8bfb0" stroke-width="1.1" rx="4"/>
  <text x="32" y="210" font-size="11" fill="#1a1612" text-anchor="start">Glass:10</text>
  <line x1="130" y1="206" x2="155.6" y2="206.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#ts-ink)"/>
  <rect x="172" y="192" width="170" height="28" fill="none" stroke="#1a1612" stroke-width="1.1" rx="4"/>
  <text x="257" y="210" font-size="10.5" fill="#1a1612" text-anchor="middle">Glass(weight=10.0)</text>
  <line x1="342" y1="206" x2="523.6" y2="197.7" stroke="#1a1612" stroke-width="1.3" marker-end="url(#ts-ink)"/>
  <text x="32" y="252" font-size="11" fill="#8b1a1a" text-anchor="start">Plastic:20</text>
  <line x1="130" y1="248" x2="155.6" y2="248.0" stroke="#8b1a1a" stroke-width="1.3" marker-end="url(#ts-red)"/>
  <rect x="172" y="234" width="170" height="28" fill="none" stroke="#8b1a1a" stroke-width="1.1" rx="4"/>
  <text x="257" y="252" font-size="10.5" fill="#8b1a1a" text-anchor="middle">Plastic(weight=20.0)</text>
  <line x1="342" y1="248" x2="523.6" y2="248.9" stroke="#8b1a1a" stroke-width="1.3" marker-end="url(#ts-red)"/>
  <text x="32" y="294" font-size="11" fill="#1a1612" text-anchor="start">Aluminum:30</text>
  <line x1="130" y1="290" x2="155.6" y2="290.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#ts-ink)"/>
  <rect x="172" y="276" width="170" height="28" fill="none" stroke="#1a1612" stroke-width="1.1" rx="4"/>
  <text x="257" y="294" font-size="10.5" fill="#1a1612" text-anchor="middle">Aluminum(weight=30.0)</text>
  <line x1="342" y1="290" x2="523.8" y2="316.6" stroke="#1a1612" stroke-width="1.3" marker-end="url(#ts-ink)"/>
  <text x="32" y="336" font-size="11" fill="#8b1a1a" text-anchor="start">Plastic:40</text>
  <line x1="130" y1="332" x2="155.6" y2="332.0" stroke="#8b1a1a" stroke-width="1.3" marker-end="url(#ts-red)"/>
  <rect x="172" y="318" width="170" height="28" fill="none" stroke="#8b1a1a" stroke-width="1.1" rx="4"/>
  <text x="257" y="336" font-size="10.5" fill="#8b1a1a" text-anchor="middle">Plastic(weight=40.0)</text>
  <line x1="342" y1="332" x2="524.4" y2="272.1" stroke="#8b1a1a" stroke-width="1.3" marker-end="url(#ts-red)"/>
  <rect x="540" y="174" width="180" height="46" fill="none" stroke="#1a1612" stroke-width="1.1" rx="4"/>
  <text x="552" y="193" font-size="11" fill="#1a1612" font-weight="bold" text-anchor="start">--- Glass ---</text>
  <text x="552" y="210" font-size="10.5" fill="#1a1612" text-anchor="start">Total value = 2.30</text>
  <rect x="540" y="235" width="180" height="46" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="4"/>
  <text x="552" y="254" font-size="11" fill="#8b1a1a" font-weight="bold" text-anchor="start">--- Plastic ---</text>
  <text x="552" y="271" font-size="10.5" fill="#8b1a1a" text-anchor="start">Total value = 9.00</text>
  <rect x="540" y="296" width="180" height="46" fill="none" stroke="#1a1612" stroke-width="1.1" rx="4"/>
  <text x="552" y="315" font-size="11" fill="#1a1612" font-weight="bold" text-anchor="start">--- Aluminum ---</text>
  <text x="552" y="332" font-size="10.5" fill="#1a1612" text-anchor="start">Total value = 50.10</text>
  <text x="540" y="368" font-size="11.5" fill="#1a1612" font-weight="bold" text-anchor="start">parsed 4, binned 4</text>
</svg>
