<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 610"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>Four steps of iteration: a for loop calls iter(nums) once, calls next(it) for each item, ends when next(it) raises StopIteration, and total() makes the same calls on a list, a generator, or Countdown with no edit</title>
  <defs>
    <marker id="is-ink" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#1a1612" stroke="#1a1612" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
    <marker id="is-red" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#8b1a1a" stroke="#8b1a1a" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
    <marker id="is-ink-open" viewBox="0 0 18 12" refX="17" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5,1.5 L17,6 L1.5,10.5" fill="none" stroke="#1a1612" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="is-red-open" viewBox="0 0 18 12" refX="17" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5,1.5 L17,6 L1.5,10.5" fill="none" stroke="#8b1a1a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <path d="M525,16 H665 V148 H525 Z" fill="#eeeeee" stroke="none" stroke-width="1.6"/>
  <rect x="140" y="24" width="150" height="122" fill="none" stroke="#1a1612" stroke-width="1.6" rx="4"/>
  <text x="152" y="44" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">for x in nums</text>
  <rect x="405" y="40" width="90" height="90" fill="none" stroke="#1a1612" stroke-width="1.3" rx="4"/>
  <text x="450" y="90" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="middle">it</text>
  <text x="22" y="54" font-size="30" fill="#8b1a1a" font-weight="bold" text-anchor="start">1</text>
  <text x="22" y="76" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">iter</text>
  <text x="22" y="96" font-size="10.5" fill="#7a6e62" text-anchor="start">once, before</text>
  <text x="22" y="111" font-size="10.5" fill="#7a6e62" text-anchor="start">the loop; the</text>
  <text x="22" y="126" font-size="10.5" fill="#7a6e62" text-anchor="start">iterator keeps</text>
  <text x="22" y="141" font-size="10.5" fill="#7a6e62" text-anchor="start">the place</text>
  <text x="657" y="34" font-size="10" fill="#7a6e62" text-anchor="end">hidden from the loop</text>
  <text x="552" y="52" font-size="10" fill="#7a6e62" text-anchor="start">nums</text>
  <rect x="552" y="60" width="40" height="30" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="3"/>
  <text x="572" y="80" font-size="13" fill="#1a1612" text-anchor="middle">1</text>
  <rect x="598" y="60" width="40" height="30" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="3"/>
  <text x="618" y="80" font-size="13" fill="#1a1612" text-anchor="middle">2</text>
  <line x1="290" y1="75" x2="388.6" y2="75.0" stroke="#1a1612" stroke-width="1.6" marker-end="url(#is-ink)"/>
  <text x="341.5" y="70" font-size="10" fill="#1a1612" text-anchor="middle">iter(nums)</text>
  <line x1="495" y1="75" x2="535.6" y2="75.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#is-ink)"/>
  <text x="552" y="104" font-size="10" fill="#7a6e62" text-anchor="start">next up</text>
  <line x1="16" y1="156" x2="714" y2="156" stroke="#c8bfb0" stroke-width="0.8"/>
  <path d="M525,166 H665 V298 H525 Z" fill="#eeeeee" stroke="none" stroke-width="1.6"/>
  <rect x="140" y="174" width="150" height="122" fill="none" stroke="#1a1612" stroke-width="1.6" rx="4"/>
  <text x="152" y="194" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">for x in nums</text>
  <rect x="405" y="190" width="90" height="90" fill="none" stroke="#1a1612" stroke-width="1.3" rx="4"/>
  <text x="450" y="240" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="middle">it</text>
  <text x="22" y="204" font-size="30" fill="#8b1a1a" font-weight="bold" text-anchor="start">2</text>
  <text x="22" y="226" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">next</text>
  <text x="22" y="246" font-size="10.5" fill="#7a6e62" text-anchor="start">once per step;</text>
  <text x="22" y="261" font-size="10.5" fill="#7a6e62" text-anchor="start">each call hands</text>
  <text x="22" y="276" font-size="10.5" fill="#7a6e62" text-anchor="start">over one item</text>
  <text x="552" y="202" font-size="10" fill="#7a6e62" text-anchor="start">nums</text>
  <rect x="552" y="210" width="40" height="30" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="3"/>
  <text x="572" y="230" font-size="13" fill="#8b1a1a" text-anchor="middle">1</text>
  <rect x="598" y="210" width="40" height="30" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="3"/>
  <text x="618" y="230" font-size="13" fill="#8b1a1a" text-anchor="middle">2</text>
  <line x1="290" y1="204" x2="388.6" y2="204.0" stroke="#8b1a1a" stroke-width="1.6" marker-end="url(#is-red)"/>
  <text x="341.5" y="199" font-size="10" fill="#8b1a1a" text-anchor="middle">next(it)</text>
  <line x1="405" y1="224" x2="294.0" y2="224.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#is-ink-open)"/>
  <text x="353.5" y="219" font-size="12" fill="#1a1612" text-anchor="middle">1</text>
  <text x="152" y="228" font-size="11" fill="#8b1a1a" text-anchor="start">x = 1</text>
  <line x1="290" y1="252" x2="388.6" y2="252.0" stroke="#8b1a1a" stroke-width="1.6" marker-end="url(#is-red)"/>
  <text x="341.5" y="247" font-size="10" fill="#8b1a1a" text-anchor="middle">next(it)</text>
  <line x1="405" y1="272" x2="294.0" y2="272.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#is-ink-open)"/>
  <text x="353.5" y="267" font-size="12" fill="#1a1612" text-anchor="middle">2</text>
  <text x="152" y="276" font-size="11" fill="#8b1a1a" text-anchor="start">x = 2</text>
  <line x1="16" y1="306" x2="714" y2="306" stroke="#c8bfb0" stroke-width="0.8"/>
  <path d="M525,316 H665 V448 H525 Z" fill="#eeeeee" stroke="none" stroke-width="1.6"/>
  <rect x="140" y="324" width="150" height="122" fill="none" stroke="#1a1612" stroke-width="1.6" rx="4"/>
  <text x="152" y="344" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">for x in nums</text>
  <rect x="405" y="340" width="90" height="90" fill="none" stroke="#1a1612" stroke-width="1.3" rx="4"/>
  <text x="450" y="390" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="middle">it</text>
  <text x="22" y="354" font-size="30" fill="#8b1a1a" font-weight="bold" text-anchor="start">3</text>
  <text x="22" y="376" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">stop</text>
  <text x="22" y="396" font-size="10.5" fill="#7a6e62" text-anchor="start">the only way to</text>
  <text x="22" y="411" font-size="10.5" fill="#7a6e62" text-anchor="start">ask is to take;</text>
  <text x="22" y="426" font-size="10.5" fill="#7a6e62" text-anchor="start">the loop ends</text>
  <text x="552" y="352" font-size="10" fill="#7a6e62" text-anchor="start">nums</text>
  <rect x="552" y="360" width="40" height="30" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="3"/>
  <text x="572" y="380" font-size="13" fill="#7a6e62" text-anchor="middle">1</text>
  <rect x="598" y="360" width="40" height="30" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="3"/>
  <text x="618" y="380" font-size="13" fill="#7a6e62" text-anchor="middle">2</text>
  <line x1="290" y1="366" x2="388.6" y2="366.0" stroke="#8b1a1a" stroke-width="1.6" marker-end="url(#is-red)"/>
  <text x="341.5" y="361" font-size="10" fill="#8b1a1a" text-anchor="middle">next(it)</text>
  <line x1="405" y1="402" x2="294.0" y2="402.0" stroke="#8b1a1a" stroke-width="1.3" marker-end="url(#is-red-open)"/>
  <text x="353.5" y="397" font-size="10" fill="#8b1a1a" text-anchor="middle">StopIteration</text>
  <text x="152" y="406" font-size="11" fill="#8b1a1a" text-anchor="start">break</text>
  <text x="450" y="412" font-size="10" fill="#7a6e62" text-anchor="middle">none left</text>
  <line x1="16" y1="456" x2="714" y2="456" stroke="#c8bfb0" stroke-width="0.8"/>
  <path d="M525,466 H665 V598 H525 Z" fill="#eeeeee" stroke="none" stroke-width="1.6"/>
  <rect x="140" y="474" width="150" height="122" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="4"/>
  <text x="152" y="494" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">total()</text>
  <rect x="405" y="490" width="90" height="90" fill="none" stroke="#1a1612" stroke-width="1.3" rx="4"/>
  <text x="450" y="540" font-size="11" fill="#1a1612" text-anchor="middle">iterator</text>
  <text x="22" y="504" font-size="30" fill="#8b1a1a" font-weight="bold" text-anchor="start">4</text>
  <text x="22" y="526" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">swap</text>
  <text x="22" y="546" font-size="10.5" fill="#7a6e62" text-anchor="start">any source</text>
  <text x="22" y="561" font-size="10.5" fill="#7a6e62" text-anchor="start">answers the</text>
  <text x="22" y="576" font-size="10.5" fill="#7a6e62" text-anchor="start">same calls</text>
  <text x="657" y="484" font-size="10" fill="#7a6e62" text-anchor="end">hidden from total()</text>
  <text x="152" y="514" font-size="11" fill="#7a6e62" text-anchor="start">sum(numbers)</text>
  <text x="152" y="560" font-size="11" fill="#8b1a1a" text-anchor="start">no edit to</text>
  <text x="152" y="575" font-size="11" fill="#8b1a1a" text-anchor="start">total()</text>
  <line x1="290" y1="520" x2="388.6" y2="520.0" stroke="#8b1a1a" stroke-width="1.6" marker-end="url(#is-red)"/>
  <text x="341.5" y="515" font-size="10" fill="#8b1a1a" text-anchor="middle">next()</text>
  <text x="697.5" y="484" font-size="10" fill="#7a6e62" text-anchor="middle">returns</text>
  <rect x="540" y="493" width="116" height="24" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="3"/>
  <text x="598" y="509" font-size="10.5" fill="#1a1612" text-anchor="middle">[1, 2, 3, 4]</text>
  <line x1="495" y1="505" x2="523.6" y2="505.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#is-ink)"/>
  <text x="697.5" y="509" font-size="12" fill="#1a1612" text-anchor="middle">10</text>
  <rect x="540" y="523" width="116" height="24" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="3"/>
  <text x="598" y="539" font-size="10.5" fill="#1a1612" text-anchor="middle">fibonacci(8)</text>
  <line x1="495" y1="535" x2="523.6" y2="535.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#is-ink)"/>
  <text x="697.5" y="539" font-size="12" fill="#1a1612" text-anchor="middle">33</text>
  <rect x="540" y="553" width="116" height="24" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="3"/>
  <text x="598" y="569" font-size="10.5" fill="#1a1612" text-anchor="middle">Countdown(5)</text>
  <line x1="495" y1="565" x2="523.6" y2="565.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#is-ink)"/>
  <text x="697.5" y="569" font-size="12" fill="#1a1612" text-anchor="middle">15</text>
</svg>
