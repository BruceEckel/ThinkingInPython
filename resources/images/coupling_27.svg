<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 236"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>The caller names make(), and make() is the one place that names Shape, Circle, and Square</title>
  <defs>
    <marker id="c27-solid" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#1a1612" stroke="#1a1612" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
    <marker id="c27-hollow" viewBox="0 0 18 12" refX="1" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L17.4,6 L1,11 Z" fill="none" stroke="#1a1612" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>
    <marker id="c27-hollow-muted" viewBox="0 0 18 12" refX="1" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L17.4,6 L1,11 Z" fill="none" stroke="#7a6e62" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="10" y="20" font-size="13" font-weight="bold" font-style="italic" fill="#1a1612" text-anchor="start">Factory</text>
  <line x1="10" y1="27" x2="440" y2="27" stroke="#c8bfb0" stroke-width="0.8"/>
  <rect x="20" y="48" width="80" height="38" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="4"/>
  <text x="60.0" y="71.2" font-size="12" font-weight="bold" fill="#1a1612" text-anchor="middle">caller</text>
  <rect x="172" y="48" width="90" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="217.0" y="71.2" font-size="12" fill="#1a1612" text-anchor="middle">make()</text>
  <rect x="20" y="168" width="80" height="38" fill="none" stroke="#7a6e62" stroke-width="1.3" rx="12"/>
  <text x="60.0" y="191.2" font-size="12" fill="#7a6e62" text-anchor="middle">Shape</text>
  <rect x="177" y="168" width="80" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="217.0" y="191.2" font-size="12" fill="#1a1612" text-anchor="middle">Circle</text>
  <rect x="324" y="168" width="80" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="364.0" y="191.2" font-size="12" fill="#1a1612" text-anchor="middle">Square</text>
  <line x1="102.0" y1="67.0" x2="155.6" y2="67.0" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c27-solid)"/>
  <line x1="196.0" y1="88.0" x2="112.8" y2="171.2" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c27-solid)"/>
  <text x="120.0" y="130.0" font-size="10.5" fill="#8b1a1a" text-anchor="middle">returns</text>
  <line x1="217.0" y1="88.0" x2="217.0" y2="151.6" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c27-solid)"/>
  <text x="247.0" y="130.0" font-size="10.5" fill="#8b1a1a" text-anchor="middle">SHAPES</text>
  <line x1="237.6" y1="88.0" x2="311.3" y2="163.1" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c27-solid)"/>
  <line x1="175.0" y1="187.0" x2="120.4" y2="187.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c27-hollow)"/>
  <path d="M322.0,187.0 Q220.6,229.8 119.3,193.0" fill="none" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c27-hollow)"/>
  <text x="10" y="224" font-size="10.5" fill="#7a6e62" text-anchor="start">heavy edges: 3. The two that name a shape sit in one table, and self-registration removes them.</text>
  <line class="legend" x1="480" y1="60" x2="497.6" y2="60" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c27-solid)"/>
  <text x="518" y="64" font-size="10.5" fill="#7a6e62" text-anchor="start">names a concrete class</text>
  <line class="legend" x1="480" y1="80" x2="497.6" y2="80" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c27-solid)"/>
  <text x="518" y="84" font-size="10.5" fill="#7a6e62" text-anchor="start">names an interface</text>
  <line class="legend" x1="480" y1="100" x2="493.6" y2="100" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c27-hollow)"/>
  <text x="518" y="104" font-size="10.5" fill="#7a6e62" text-anchor="start">inherits its internals</text>
  <rect x="482" y="112" width="26" height="16" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="3"/>
  <text x="518" y="124" font-size="10.5" fill="#7a6e62" text-anchor="start">does not change</text>
</svg>
