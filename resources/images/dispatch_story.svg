  <text x="264" y="103" font-size="10.5" fill="#1a1612" text-anchor="middle">win</text>
  <text x="108" y="129" font-size="10.5" fill="#8b1a1a" text-anchor="end">eval_scissors()</text>
  <rect x="117" y="115" width="54" height="20" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="3"/>
  <text x="144" y="129" font-size="10.5" fill="#8b1a1a" font-weight="bold" text-anchor="middle">win</text>
