<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 346"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>The nine paper, scissors, rock answers drawn as a grid twice: the method version spreads them across the classes and picks a cell with two dispatches, the table version keeps them in OUTCOME and picks the same cell with one lookup</title>
  <text x="14" y="20" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">two dispatches</text>
  <text x="14" y="36" font-size="10.5" fill="#7a6e62" text-anchor="start">paper_scissors_rock.py</text>
  <text x="114" y="52" font-size="10" fill="#7a6e62" text-anchor="start">each column is one class</text>
  <path d="M118,60 H170 Q174,60 174,64 V186 Q174,190 170,190 H118 Q114,190 114,186 V64 Q114,60 118,60 Z" fill="none" stroke="#1a1612" stroke-width="1.2"/>
  <path d="M178,60 H230 Q234,60 234,64 V186 Q234,190 230,190 H178 Q174,190 174,186 V64 Q174,60 178,60 Z" fill="none" stroke="#1a1612" stroke-width="1.2"/>
  <path d="M238,60 H290 Q294,60 294,64 V186 Q294,190 290,190 H238 Q234,190 234,186 V64 Q234,60 238,60 Z" fill="none" stroke="#1a1612" stroke-width="1.2"/>
  <path d="M298,60 H350 Q354,60 354,64 V186 Q354,190 350,190 H298 Q294,190 294,186 V64 Q294,60 298,60 Z" fill="none" stroke="#7a6e62" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="144" y="77" font-size="10.5" fill="#8b1a1a" font-weight="bold" text-anchor="middle">Paper</text>
  <text x="204" y="77" font-size="10.5" fill="#1a1612" font-weight="bold" text-anchor="middle">Scissors</text>
  <text x="264" y="77" font-size="10.5" fill="#1a1612" font-weight="bold" text-anchor="middle">Rock</text>
  <text x="324" y="77" font-size="10.5" fill="#7a6e62" text-anchor="middle">new</text>
  <text x="108" y="103" font-size="10.5" fill="#1a1612" text-anchor="end">eval_paper()</text>
  <rect x="117" y="89" width="54" height="20" fill="none" stroke="#c8bfb0" stroke-width="1" rx="3"/>
  <text x="144" y="103" font-size="10.5" fill="#1a1612" text-anchor="middle">draw</text>
