  <text x="696" y="77" font-size="10.5" fill="#7a6e62" text-anchor="middle">new</text>
  <text x="480" y="103" font-size="10.5" fill="#1a1612" text-anchor="end">Paper</text>
  <rect x="489" y="89" width="54" height="20" fill="none" stroke="#c8bfb0" stroke-width="1" rx="3"/>
  <text x="516" y="103" font-size="10.5" fill="#1a1612" text-anchor="middle">draw</text>
  <rect x="549" y="89" width="54" height="20" fill="none" stroke="#c8bfb0" stroke-width="1" rx="3"/>
  <text x="576" y="103" font-size="10.5" fill="#1a1612" text-anchor="middle">lose</text>
  <rect x="609" y="89" width="54" height="20" fill="none" stroke="#c8bfb0" stroke-width="1" rx="3"/>
  <text x="636" y="103" font-size="10.5" fill="#1a1612" text-anchor="middle">win</text>
  <text x="480" y="129" font-size="10.5" fill="#8b1a1a" text-anchor="end">Scissors</text>
  <rect x="489" y="115" width="54" height="20" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="3"/>
  <text x="516" y="129" font-size="10.5" fill="#8b1a1a" font-weight="bold" text-anchor="middle">win</text>
  <rect x="549" y="115" width="54" height="20" fill="none" stroke="#c8bfb0" stroke-width="1" rx="3"/>
  <text x="576" y="129" font-size="10.5" fill="#1a1612" text-anchor="middle">draw</text>
