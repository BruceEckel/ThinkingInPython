  <rect x="669" y="141" width="54" height="20" fill="none" stroke="#c8bfb0" stroke-width="1" rx="3" stroke-dasharray="4,3"/>
  <rect x="669" y="167" width="54" height="20" fill="none" stroke="#c8bfb0" stroke-width="1" rx="3" stroke-dasharray="4,3"/>
  <rect x="489" y="167" width="54" height="20" fill="none" stroke="#c8bfb0" stroke-width="1" rx="3" stroke-dasharray="4,3"/>
  <rect x="549" y="167" width="54" height="20" fill="none" stroke="#c8bfb0" stroke-width="1" rx="3" stroke-dasharray="4,3"/>
  <rect x="609" y="167" width="54" height="20" fill="none" stroke="#c8bfb0" stroke-width="1" rx="3" stroke-dasharray="4,3"/>
  <text x="386" y="212" font-size="13" fill="#8b1a1a" font-weight="bold" text-anchor="start">1</text>
  <text x="402" y="212" font-size="10.5" fill="#1a1612" text-anchor="start">OUTCOME[type(self), type(item)]</text>
  <text x="402" y="226" font-size="10.5" fill="#7a6e62" text-anchor="start">picks the row and the column</text>
  <text x="402" y="240" font-size="10.5" fill="#7a6e62" text-anchor="start">in one step</text>
  <text x="386" y="288" font-size="10.5" fill="#8b1a1a" text-anchor="start">a new item adds 7 rows to</text>
  <text x="386" y="302" font-size="10.5" fill="#8b1a1a" text-anchor="start">OUTCOME, with no methods to edit</text>
  <text x="366" y="334" font-size="10.5" fill="#7a6e62" text-anchor="end">both print</text>
  <text x="374" y="334" font-size="11" fill="#1a1612" text-anchor="start">Scissors &lt;--&gt; Paper : win</text>
</svg>
