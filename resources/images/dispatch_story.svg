  <rect x="489" y="141" width="54" height="20" fill="none" stroke="#c8bfb0" stroke-width="1" rx="3"/>
  <text x="516" y="155" font-size="10.5" fill="#1a1612" text-anchor="middle">lose</text>
  <rect x="549" y="141" width="54" height="20" fill="none" stroke="#c8bfb0" stroke-width="1" rx="3"/>
  <text x="576" y="155" font-size="10.5" fill="#1a1612" text-anchor="middle">win</text>
