  <text x="204" y="129" font-size="10.5" fill="#1a1612" text-anchor="middle">draw</text>
  <rect x="237" y="115" width="54" height="20" fill="none" stroke="#c8bfb0" stroke-width="1" rx="3"/>
  <text x="264" y="129" font-size="10.5" fill="#1a1612" text-anchor="middle">lose</text>
  <text x="108" y="155" font-size="10.5" fill="#1a1612" text-anchor="end">eval_rock()</text>
  <rect x="117" y="141" width="54" height="20" fill="none" stroke="#c8bfb0" stroke-width="1" rx="3"/>
  <text x="144" y="155" font-size="10.5" fill="#1a1612" text-anchor="middle">lose</text>
  <rect x="177" y="141" width="54" height="20" fill="none" stroke="#c8bfb0" stroke-width="1" rx="3"/>
  <text x="204" y="155" font-size="10.5" fill="#1a1612" text-anchor="middle">win</text>
  <rect x="237" y="141" width="54" height="20" fill="none" stroke="#c8bfb0" stroke-width="1" rx="3"/>
  <text x="264" y="155" font-size="10.5" fill="#1a1612" text-anchor="middle">draw</text>
  <text x="108" y="181" font-size="10.5" fill="#7a6e62" text-anchor="end">new</text>
