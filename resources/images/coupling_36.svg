<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 236"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>Sketch names Memento, and History names only a type parameter, so it holds a Memento without reading it</title>
  <defs>
    <marker id="c36-solid" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#1a1612" stroke="#1a1612" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
    <marker id="c36-hollow" viewBox="0 0 18 12" refX="1" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L17.4,6 L1,11 Z" fill="none" stroke="#1a1612" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="10" y="20" font-size="13" font-weight="bold" font-style="italic" fill="#1a1612" text-anchor="start">Memento</text>
  <line x1="10" y1="27" x2="440" y2="27" stroke="#c8bfb0" stroke-width="0.8"/>
  <rect x="20" y="48" width="100" height="38" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="4"/>
  <text x="70.0" y="71.2" font-size="12" font-weight="bold" fill="#1a1612" text-anchor="middle">Sketch</text>
  <rect x="182" y="48" width="96" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="230.0" y="71.2" font-size="12" fill="#1a1612" text-anchor="middle">Memento</text>
  <rect x="20" y="168" width="110" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="75.0" y="191.2" font-size="12" fill="#1a1612" text-anchor="middle">History[S]</text>
  <rect x="182" y="168" width="96" height="38" fill="none" stroke="#7a6e62" stroke-width="1.3" rx="12"/>
  <text x="230.0" y="184.2" font-size="12" fill="#7a6e62" text-anchor="middle">S</text>
  <text x="230.0" y="199.2" font-size="9" fill="#7a6e62" text-anchor="middle">any value</text>
  <line x1="122.0" y1="67.0" x2="165.6" y2="67.0" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c36-solid)"/>
  <text x="150.0" y="85.0" font-size="10.5" fill="#8b1a1a" text-anchor="middle">save, restore</text>
  <line x1="132.0" y1="187.0" x2="165.6" y2="187.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c36-solid)"/>
  <line x1="230.0" y1="88.0" x2="230.0" y2="147.6" stroke="#7a6e62" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#c36-hollow)"/>
  <text x="10" y="224" font-size="10.5" fill="#7a6e62" text-anchor="start">heavy edges: 1, inside the originator. The caretaker names no memento type.</text>
  <line x1="480" y1="60" x2="497.6" y2="60" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c36-solid)"/>
  <text x="518" y="64" font-size="10.5" fill="#7a6e62" text-anchor="start">names a concrete class</text>
  <line x1="480" y1="80" x2="497.6" y2="80" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c36-solid)"/>
  <text x="518" y="84" font-size="10.5" fill="#7a6e62" text-anchor="start">names an interface</text>
  <line x1="480" y1="100" x2="493.6" y2="100" stroke="#7a6e62" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#c36-hollow)"/>
  <text x="518" y="104" font-size="10.5" fill="#7a6e62" text-anchor="start">satisfies it</text>
  <line x1="480" y1="120" x2="493.6" y2="120" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c36-hollow)"/>
  <text x="518" y="124" font-size="10.5" fill="#7a6e62" text-anchor="start">inherits its internals</text>
  <rect x="482" y="132" width="26" height="16" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="3"/>
  <text x="518" y="144" font-size="10.5" fill="#7a6e62" text-anchor="start">kept free of change</text>
</svg>
