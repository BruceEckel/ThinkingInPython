<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 246"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>The list that builds macro names three functions, and the loop that runs it names only the Command signature</title>
  <defs>
    <marker id="c28-solid" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#1a1612" stroke="#1a1612" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
    <marker id="c28-hollow" viewBox="0 0 18 12" refX="1" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L17.4,6 L1,11 Z" fill="none" stroke="#1a1612" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>
    <marker id="c28-hollow-muted" viewBox="0 0 18 12" refX="1" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L17.4,6 L1,11 Z" fill="none" stroke="#7a6e62" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="10" y="20" font-size="13" font-weight="bold" font-style="italic" fill="#1a1612" text-anchor="start">Function Objects</text>
  <line x1="10" y1="27" x2="440" y2="27" stroke="#c8bfb0" stroke-width="0.8"/>
  <rect x="20" y="48" width="100" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="70.0" y="64.2" font-size="12" fill="#1a1612" text-anchor="middle">macro</text>
  <text x="70.0" y="79.2" font-size="9" fill="#7a6e62" text-anchor="middle">list[Command]</text>
  <rect x="172" y="48" width="96" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="220.0" y="71.2" font-size="12" fill="#1a1612" text-anchor="middle">no_more()</text>
  <rect x="172" y="108" width="96" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="220.0" y="131.2" font-size="12" fill="#1a1612" text-anchor="middle">ceased()</text>
  <rect x="172" y="168" width="96" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="220.0" y="191.2" font-size="12" fill="#1a1612" text-anchor="middle">fjords()</text>
  <rect x="324" y="108" width="120" height="38" fill="none" stroke="#7a6e62" stroke-width="1.3" rx="12"/>
  <text x="384.0" y="124.2" font-size="12" fill="#7a6e62" text-anchor="middle">Command</text>
  <text x="384.0" y="139.2" font-size="9" fill="#7a6e62" text-anchor="middle">Callable[[], None]</text>
  <rect x="304" y="182" width="160" height="38" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="4"/>
  <text x="384.0" y="198.2" font-size="12" font-weight="bold" fill="#1a1612" text-anchor="middle">for command in macro</text>
  <text x="384.0" y="213.2" font-size="9" fill="#7a6e62" text-anchor="middle">command()</text>
  <line x1="122.0" y1="67.0" x2="155.6" y2="67.0" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c28-solid)"/>
  <line x1="122.0" y1="87.8" x2="158.3" y2="102.3" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c28-solid)"/>
  <line x1="89.6" y1="88.0" x2="159.5" y2="162.9" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c28-solid)"/>
  <line x1="270.0" y1="85.3" x2="312.2" y2="100.7" stroke="#7a6e62" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#c28-hollow-muted)"/>
  <line x1="270.0" y1="127.0" x2="303.6" y2="127.0" stroke="#7a6e62" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#c28-hollow-muted)"/>
  <line x1="270.0" y1="168.7" x2="312.2" y2="153.3" stroke="#7a6e62" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#c28-hollow-muted)"/>
  <line x1="384.0" y1="180.0" x2="384.0" y2="162.4" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c28-solid)"/>
  <text x="10" y="234" font-size="10.5" fill="#7a6e62" text-anchor="start">heavy edges: 3, all in the line that builds the list. The loop names none.</text>
  <line x1="480" y1="60" x2="497.6" y2="60" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c28-solid)"/>
  <text x="518" y="64" font-size="10.5" fill="#7a6e62" text-anchor="start">names a concrete class</text>
  <line x1="480" y1="80" x2="497.6" y2="80" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c28-solid)"/>
  <text x="518" y="84" font-size="10.5" fill="#7a6e62" text-anchor="start">names an interface</text>
  <line x1="480" y1="100" x2="493.6" y2="100" stroke="#7a6e62" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#c28-hollow-muted)"/>
  <text x="518" y="104" font-size="10.5" fill="#7a6e62" text-anchor="start">satisfies it</text>
  <line x1="480" y1="120" x2="493.6" y2="120" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c28-hollow)"/>
  <text x="518" y="124" font-size="10.5" fill="#7a6e62" text-anchor="start">inherits its internals</text>
  <rect x="482" y="132" width="26" height="16" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="3"/>
  <text x="518" y="144" font-size="10.5" fill="#7a6e62" text-anchor="start">kept free of change</text>
</svg>
