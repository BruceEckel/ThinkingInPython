<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 236"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>The list that builds macro names three functions, and the loop that runs it names only the Command signature</title>
  <defs>
    <marker id="c28-solid" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1a1612" stroke="#1a1612" stroke-width="1"/>
    </marker>
    <marker id="c28-hollow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f5f0e8" stroke="#1a1612" stroke-width="1"/>
    </marker>
  </defs>
  <text x="10" y="20" font-size="13" font-weight="bold" font-style="italic" fill="#1a1612" text-anchor="start">Function Objects</text>
  <line x1="10" y1="27" x2="440" y2="27" stroke="#c8bfb0" stroke-width="0.8"/>
  <rect x="20" y="48" width="100" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="70.0" y="64.2" font-size="12" fill="#1a1612" text-anchor="middle">macro</text>
  <text x="70.0" y="79.2" font-size="9" fill="#7a6e62" text-anchor="middle">list[Command]</text>
  <rect x="20" y="168" width="160" height="38" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="4"/>
  <text x="100.0" y="184.2" font-size="12" font-weight="bold" fill="#1a1612" text-anchor="middle">for command in macro</text>
  <text x="100.0" y="199.2" font-size="9" fill="#7a6e62" text-anchor="middle">command()</text>
  <rect x="202" y="168" width="110" height="38" fill="none" stroke="#7a6e62" stroke-width="1.3" rx="12"/>
  <text x="257.0" y="184.2" font-size="12" fill="#7a6e62" text-anchor="middle">Command</text>
  <text x="257.0" y="199.2" font-size="9" fill="#7a6e62" text-anchor="middle">Callable[[], None]</text>
  <rect x="334" y="48" width="96" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="382.0" y="71.2" font-size="12" fill="#1a1612" text-anchor="middle">no_more()</text>
  <rect x="334" y="108" width="96" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="382.0" y="131.2" font-size="12" fill="#1a1612" text-anchor="middle">ceased()</text>
  <rect x="334" y="168" width="96" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="382.0" y="191.2" font-size="12" fill="#1a1612" text-anchor="middle">fjords()</text>
  <line x1="182.0" y1="187.0" x2="198.0" y2="187.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c28-solid)"/>
  <line x1="122.0" y1="67.0" x2="330.0" y2="67.0" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c28-solid)"/>
  <line x1="122.0" y1="77.0" x2="330.0" y2="117.0" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c28-solid)"/>
  <line x1="122.0" y1="87.0" x2="330.0" y2="167.0" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c28-solid)"/>
  <line x1="360.1" y1="88.0" x2="281.0" y2="164.0" stroke="#7a6e62" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#c28-hollow)"/>
  <line x1="342.6" y1="157.0" x2="309.2" y2="173.0" stroke="#7a6e62" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#c28-hollow)"/>
  <line x1="332.0" y1="179.0" x2="316.0" y2="179.0" stroke="#7a6e62" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#c28-hollow)"/>
  <text x="10" y="224" font-size="10.5" fill="#7a6e62" text-anchor="start">heavy edges: 3, all in the line that builds the list. The loop names none.</text>
  <line x1="480" y1="60" x2="510" y2="60" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c28-solid)"/>
  <text x="518" y="64" font-size="10.5" fill="#7a6e62" text-anchor="start">names a concrete class</text>
  <line x1="480" y1="80" x2="510" y2="80" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c28-solid)"/>
  <text x="518" y="84" font-size="10.5" fill="#7a6e62" text-anchor="start">names an interface</text>
  <line x1="480" y1="100" x2="510" y2="100" stroke="#7a6e62" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#c28-hollow)"/>
  <text x="518" y="104" font-size="10.5" fill="#7a6e62" text-anchor="start">satisfies it</text>
  <line x1="480" y1="120" x2="510" y2="120" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c28-hollow)"/>
  <text x="518" y="124" font-size="10.5" fill="#7a6e62" text-anchor="start">inherits its internals</text>
  <rect x="482" y="132" width="26" height="16" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="3"/>
  <text x="518" y="144" font-size="10.5" fill="#7a6e62" text-anchor="start">kept free of change</text>
</svg>
