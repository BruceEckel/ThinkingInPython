<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>The three channels between a driver and a generator: yield carries a Question out, send() carries an Answer in, and return carries a Result out as StopIteration.value</title>
  <defs>
    <marker id="ink" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#1a1612" stroke="#1a1612" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
    <marker id="ink_open" viewBox="0 0 18 12" refX="17" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5,1.5 L17,6 L1.5,10.5" fill="none" stroke="#1a1612" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="30" y="60" width="160" height="110" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="110" y="88" font-size="15" fill="#1a1612" font-weight="bold" text-anchor="middle">driver</text>
  <text x="110" y="110" font-size="11" fill="#7a6e62" text-anchor="middle">drive_by_hand.py</text>
  <text x="110" y="140" font-size="12" fill="#1a1612" text-anchor="middle">next() / send()</text>
  <rect x="450" y="60" width="160" height="110" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="4"/>
  <text x="530" y="88" font-size="15" fill="#1a1612" font-weight="bold" text-anchor="middle">interview()</text>
  <text x="530" y="110" font-size="11" fill="#7a6e62" text-anchor="middle">a generator</text>
  <text x="530" y="140" font-size="12" fill="#1a1612" text-anchor="middle">yield / return</text>
  <text x="320" y="72" font-size="12" fill="#1a1612" text-anchor="middle">yield Question("name")</text>
  <line x1="450" y1="82" x2="206.4" y2="82.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#ink)"/>
  <text x="320" y="112" font-size="12" fill="#1a1612" text-anchor="middle">send(Answer("Alice"))</text>
  <line x1="190" y1="122" x2="433.6" y2="122.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#ink)"/>
  <text x="320" y="152" font-size="12" fill="#1a1612" text-anchor="middle">return Result("Alice of ...")</text>
  <line x1="450" y1="162" x2="194.0" y2="162.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#ink_open)"/>
  <text x="320" y="182" font-size="11" fill="#7a6e62" text-anchor="middle">arrives as StopIteration.value</text>
</svg>
