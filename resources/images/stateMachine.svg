<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 -100 770 740"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>Vending machine state diagram</title>
  <defs>
    <marker id="sm-ink" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#1a1612" stroke="#1a1612" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
    <marker id="sm-muted" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#7a6e62" stroke="#7a6e62" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
  </defs>
  <circle cx="110" cy="330" r="50" fill="none" stroke="#1a1612" stroke-width="1.6"/>
  <text x="110" y="335" font-size="13.5" font-weight="bold" fill="#1a1612" text-anchor="middle">QUIESCENT</text>
  <circle cx="380" cy="150" r="52" fill="none" stroke="#1a1612" stroke-width="1.6"/>
  <text x="380" y="155" font-size="13.5" font-weight="bold" fill="#1a1612" text-anchor="middle">COLLECTING</text>
  <circle cx="410" cy="350" r="58" fill="none" stroke="#8b1a1a" stroke-width="1.8"/>
  <text x="410" y="355" font-size="13.5" font-weight="bold" fill="#1a1612" text-anchor="middle">SELECTING</text>
  <circle cx="720" cy="220" r="52" fill="none" stroke="#1a1612" stroke-width="1.6"/>
  <text x="720" y="225" font-size="13.5" font-weight="bold" fill="#1a1612" text-anchor="middle">UNAVAILABLE</text>
  <circle cx="720" cy="500" r="52" fill="none" stroke="#1a1612" stroke-width="1.6"/>
  <text x="720" y="505" font-size="13.5" font-weight="bold" fill="#1a1612" text-anchor="middle">WANT_MORE</text>
  <!-- initial-state marker -->
  <circle cx="110" cy="240" r="6" fill="#1a1612"/>
  <line x1="110" y1="246" x2="110" y2="267.6" stroke="#1a1612" stroke-width="1.4" marker-end="url(#sm-ink)"/>
  <!-- QUIESCENT -> COLLECTING -->
  <path d="M143.4,292.8 Q209.1,198.6 318.9,170.1" fill="none" stroke="#7a6e62" stroke-width="1.2" marker-end="url(#sm-muted)"/>
  <text x="265" y="163" font-size="11.5" fill="#8b1a1a" text-anchor="end">Money</text>
  <text x="265" y="176" font-size="11" fill="#7a6e62" text-anchor="end">/ add_money</text>
  <!-- COLLECTING -> QUIESCENT -->
  <path d="M345.2,188.7 Q279.1,282.6 169.2,310.6" fill="none" stroke="#7a6e62" stroke-width="1.2" marker-end="url(#sm-muted)"/>
  <text x="210" y="317" font-size="11.5" fill="#8b1a1a" text-anchor="start">Quit</text>
  <text x="210" y="330" font-size="11" fill="#7a6e62" text-anchor="start">/ refund</text>
  <!-- COLLECTING -> SELECTING -->
  <path d="M372.2,201.4 Q342.3,249.3 376.2,288.8" fill="none" stroke="#7a6e62" stroke-width="1.2" marker-end="url(#sm-muted)"/>
  <text x="354" y="260" font-size="11.5" fill="#8b1a1a" text-anchor="end">FirstDigit</text>
  <text x="354" y="274" font-size="11" fill="#7a6e62" text-anchor="end">/ choose_row</text>
  <!-- SELECTING -> COLLECTING -->
  <path d="M418.7,292.7 Q446.9,243.7 411.5,205.5" fill="none" stroke="#7a6e62" stroke-width="1.2" marker-end="url(#sm-muted)"/>
  <text x="438" y="191" font-size="11.5" fill="#8b1a1a" text-anchor="start">SecondDigit</text>
  <text x="438" y="205" font-size="11.5" fill="#8b1a1a" text-anchor="start">[too_expensive]</text>
  <text x="438" y="218" font-size="11" fill="#7a6e62" text-anchor="start">/ clear</text>
  <!-- SELECTING -> UNAVAILABLE -->
  <path d="M467.4,341.5 Q580.9,330.2 669.0,259.3" fill="none" stroke="#7a6e62" stroke-width="1.2" marker-end="url(#sm-muted)"/>
  <text x="583" y="331" font-size="11.5" fill="#8b1a1a" text-anchor="start">SecondDigit</text>
  <text x="583" y="344" font-size="11.5" fill="#8b1a1a" text-anchor="start">[sold_out]</text>
  <text x="583" y="358" font-size="11" fill="#7a6e62" text-anchor="start">/ clear</text>
  <!-- UNAVAILABLE -> SELECTING -->
  <path d="M668.6,227.6 Q554.9,237.5 465.9,307.2" fill="none" stroke="#7a6e62" stroke-width="1.2" marker-end="url(#sm-muted)"/>
  <text x="593" y="226" font-size="11.5" fill="#8b1a1a" text-anchor="end">FirstDigit</text>
  <text x="593" y="239" font-size="11" fill="#7a6e62" text-anchor="end">/ choose_row</text>
  <!-- SELECTING -> WANT_MORE -->
  <path d="M454.3,387.4 Q541.6,466.8 656.8,487.6" fill="none" stroke="#7a6e62" stroke-width="1.2" marker-end="url(#sm-muted)"/>
  <text x="551" y="473" font-size="11.5" fill="#8b1a1a" text-anchor="end">SecondDigit</text>
  <text x="551" y="486" font-size="11.5" fill="#8b1a1a" text-anchor="end">[else]</text>
  <text x="551" y="500" font-size="11" fill="#7a6e62" text-anchor="end">/ dispense</text>
  <!-- WANT_MORE -> SELECTING -->
  <path d="M680.3,466.5 Q594.0,386.0 479.0,363.7" fill="none" stroke="#7a6e62" stroke-width="1.2" marker-end="url(#sm-muted)"/>
  <text x="627" y="396" font-size="11.5" fill="#8b1a1a" text-anchor="start">FirstDigit</text>
  <text x="627" y="410" font-size="11" fill="#7a6e62" text-anchor="start">/ choose_row</text>
  <!-- SELECTING -> QUIESCENT -->
  <path d="M352.5,357.7 Q256.9,403.6 168.7,349.9" fill="none" stroke="#7a6e62" stroke-width="1.2" marker-end="url(#sm-muted)"/>
  <text x="253" y="396" font-size="11.5" fill="#8b1a1a" text-anchor="middle">Quit</text>
  <text x="253" y="410" font-size="11" fill="#7a6e62" text-anchor="middle">/ refund</text>
  <!-- UNAVAILABLE -> QUIESCENT -->
  <path d="M672.6,198.7 Q304.9,-338.3 148.6,282.9" fill="none" stroke="#7a6e62" stroke-width="1.2" marker-end="url(#sm-muted)"/>
  <text x="354" y="-73" font-size="11.5" fill="#8b1a1a" text-anchor="middle">Quit</text>
  <text x="354" y="-60" font-size="11" fill="#7a6e62" text-anchor="middle">/ refund</text>
  <!-- WANT_MORE -> QUIESCENT -->
  <path d="M670.8,516.8 Q330.7,728.0 147.8,379.3" fill="none" stroke="#7a6e62" stroke-width="1.2" marker-end="url(#sm-muted)"/>
  <text x="364" y="605" font-size="11.5" fill="#8b1a1a" text-anchor="middle">Quit</text>
  <text x="364" y="618" font-size="11" fill="#7a6e62" text-anchor="middle">/ refund</text>
  <!-- COLLECTING self-loop -->
  <path d="M354.0,105.0 C312.1,27.0 436.9,23.2 411.1,93.7" fill="none" stroke="#7a6e62" stroke-width="1.2" marker-end="url(#sm-muted)"/>
  <text x="436" y="44" font-size="11.5" fill="#8b1a1a" text-anchor="start">Money</text>
  <text x="436" y="58" font-size="11" fill="#7a6e62" text-anchor="start">/ add_money</text>
</svg>
