<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 -100 770 740"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>Vending machine state diagram</title>
  <defs>
    <marker id="sm-ink" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#1a1612" stroke="#1a1612" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
    <marker id="sm-muted" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#7a6e62" stroke="#7a6e62" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
  </defs>
  <circle cx="110" cy="330" r="50" fill="none" stroke="#1a1612" stroke-width="1.6"/>
  <text x="110" y="335" font-size="13.5" font-weight="bold" fill="#1a1612" text-anchor="middle">QUIESCENT</text>
  <circle cx="380" cy="150" r="52" fill="none" stroke="#1a1612" stroke-width="1.6"/>
  <text x="380" y="155" font-size="13.5" font-weight="bold" fill="#1a1612" text-anchor="middle">COLLECTING</text>
  <circle cx="410" cy="350" r="58" fill="none" stroke="#8b1a1a" stroke-width="1.8"/>
  <text x="410" y="355" font-size="13.5" font-weight="bold" fill="#1a1612" text-anchor="middle">SELECTING</text>
  <circle cx="720" cy="220" r="52" fill="none" stroke="#1a1612" stroke-width="1.6"/>
  <text x="720" y="225" font-size="13.5" font-weight="bold" fill="#1a1612" text-anchor="middle">UNAVAILABLE</text>
  <circle cx="720" cy="500" r="52" fill="none" stroke="#1a1612" stroke-width="1.6"/>
  <text x="720" y="505" font-size="13.5" font-weight="bold" fill="#1a1612" text-anchor="middle">WANT_MORE</text>
  <!-- initial-state marker -->
  <circle cx="110" cy="240" r="6" fill="#1a1612"/>
  <line x1="110" y1="246" x2="110" y2="263.6" stroke="#1a1612" stroke-width="1.4" marker-end="url(#sm-ink)"/>
  <!-- QUIESCENT -> COLLECTING -->
  <path d="M143.4,292.8 Q207.1,199.4 315.1,171.5" fill="none" stroke="#7a6e62" stroke-width="1.2" marker-end="url(#sm-muted)"/>
  <text x="263" y="164" font-size="11.5" fill="#8b1a1a" text-anchor="end">Money</text>
  <text x="263" y="177" font-size="11" fill="#7a6e62" text-anchor="end">/ add_money</text>
  <!-- COLLECTING -> QUIESCENT -->
  <path d="M345.2,188.7 Q281.1,281.8 173.0,309.3" fill="none" stroke="#7a6e62" stroke-width="1.2" marker-end="url(#sm-muted)"/>
  <text x="213" y="315" font-size="11.5" fill="#8b1a1a" text-anchor="start">Quit</text>
  <text x="213" y="329" font-size="11" fill="#7a6e62" text-anchor="start">/ refund</text>
  <!-- COLLECTING -> SELECTING -->
  <path d="M372.2,201.4 Q341.5,247.1 374.5,285.3" fill="none" stroke="#7a6e62" stroke-width="1.2" marker-end="url(#sm-muted)"/>
  <text x="353" y="258" font-size="11.5" fill="#8b1a1a" text-anchor="end">FirstDigit</text>
  <text x="353" y="271" font-size="11" fill="#7a6e62" text-anchor="end">/ choose_row</text>
  <!-- SELECTING -> COLLECTING -->
  <path d="M418.7,292.7 Q447.6,245.9 413.3,209.0" fill="none" stroke="#7a6e62" stroke-width="1.2" marker-end="url(#sm-muted)"/>
  <text x="439" y="193" font-size="11.5" fill="#8b1a1a" text-anchor="start">SecondDigit</text>
  <text x="439" y="207" font-size="11.5" fill="#8b1a1a" text-anchor="start">[too_expensive]</text>
  <text x="439" y="220" font-size="11" fill="#7a6e62" text-anchor="start">/ clear</text>
  <!-- SELECTING -> UNAVAILABLE -->
  <path d="M467.4,341.5 Q579.1,331.4 665.8,261.7" fill="none" stroke="#7a6e62" stroke-width="1.2" marker-end="url(#sm-muted)"/>
  <text x="581" y="332" font-size="11.5" fill="#8b1a1a" text-anchor="start">SecondDigit</text>
  <text x="581" y="346" font-size="11.5" fill="#8b1a1a" text-anchor="start">[sold_out]</text>
  <text x="581" y="359" font-size="11" fill="#7a6e62" text-anchor="start">/ clear</text>
  <!-- UNAVAILABLE -> SELECTING -->
  <path d="M668.6,227.6 Q556.7,236.3 469.1,304.8" fill="none" stroke="#7a6e62" stroke-width="1.2" marker-end="url(#sm-muted)"/>
  <text x="594" y="224" font-size="11.5" fill="#8b1a1a" text-anchor="end">FirstDigit</text>
  <text x="594" y="238" font-size="11" fill="#7a6e62" text-anchor="end">/ choose_row</text>
  <!-- SELECTING -> WANT_MORE -->
  <path d="M454.3,387.4 Q539.6,466.3 652.9,486.8" fill="none" stroke="#7a6e62" stroke-width="1.2" marker-end="url(#sm-muted)"/>
  <text x="548" y="472" font-size="11.5" fill="#8b1a1a" text-anchor="end">SecondDigit</text>
  <text x="548" y="486" font-size="11.5" fill="#8b1a1a" text-anchor="end">[else]</text>
  <text x="548" y="499" font-size="11" fill="#7a6e62" text-anchor="end">/ dispense</text>
  <!-- WANT_MORE -> SELECTING -->
  <path d="M680.3,466.5 Q596.0,386.5 483.0,364.5" fill="none" stroke="#7a6e62" stroke-width="1.2" marker-end="url(#sm-muted)"/>
  <text x="629" y="397" font-size="11.5" fill="#8b1a1a" text-anchor="start">FirstDigit</text>
  <text x="629" y="410" font-size="11" fill="#7a6e62" text-anchor="start">/ choose_row</text>
  <!-- SELECTING -> QUIESCENT -->
  <path d="M352.5,357.7 Q259.0,404.0 172.5,351.0" fill="none" stroke="#7a6e62" stroke-width="1.2" marker-end="url(#sm-muted)"/>
  <text x="255" y="397" font-size="11.5" fill="#8b1a1a" text-anchor="middle">Quit</text>
  <text x="255" y="410" font-size="11" fill="#7a6e62" text-anchor="middle">/ refund</text>
  <!-- UNAVAILABLE -> QUIESCENT -->
  <path d="M672.6,198.7 Q308.8,-340.1 151.5,280.1" fill="none" stroke="#7a6e62" stroke-width="1.2" marker-end="url(#sm-muted)"/>
  <text x="356" y="-75" font-size="11.5" fill="#8b1a1a" text-anchor="middle">Quit</text>
  <text x="356" y="-61" font-size="11" fill="#7a6e62" text-anchor="middle">/ refund</text>
  <!-- WANT_MORE -> QUIESCENT -->
  <path d="M670.8,516.8 Q333.1,729.9 150.4,382.4" fill="none" stroke="#7a6e62" stroke-width="1.2" marker-end="url(#sm-muted)"/>
  <text x="366" y="607" font-size="11.5" fill="#8b1a1a" text-anchor="middle">Quit</text>
  <text x="366" y="620" font-size="11" fill="#7a6e62" text-anchor="middle">/ refund</text>
  <!-- COLLECTING self-loop -->
  <path d="M354.0,105.0 C312.2,27.2 436.3,23.2 413.0,90.2" fill="none" stroke="#7a6e62" stroke-width="1.2" marker-end="url(#sm-muted)"/>
  <text x="436" y="44" font-size="11.5" fill="#8b1a1a" text-anchor="start">Money</text>
  <text x="436" y="58" font-size="11" fill="#7a6e62" text-anchor="start">/ add_money</text>
</svg>
