<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 222"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>Proxy and Complete both inherit Service, Proxy holds one, and only the caller names either class</title>
  <defs>
    <marker id="c26-solid" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#1a1612" stroke="#1a1612" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
    <marker id="c26-hollow" viewBox="0 0 18 12" refX="1" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L17.4,6 L1,11 Z" fill="none" stroke="#1a1612" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>
    <marker id="c26-hollow-muted" viewBox="0 0 18 12" refX="1" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L17.4,6 L1,11 Z" fill="none" stroke="#7a6e62" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="10" y="20" font-size="13" font-weight="bold" font-style="italic" fill="#1a1612" text-anchor="start">Surrogate</text>
  <line x1="10" y1="27" x2="440" y2="27" stroke="#c8bfb0" stroke-width="0.8"/>
  <rect x="20" y="48" width="90" height="38" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="4"/>
  <text x="65.0" y="71.2" font-size="12" font-weight="bold" fill="#1a1612" text-anchor="middle">Proxy</text>
  <rect x="182" y="48" width="96" height="38" fill="none" stroke="#7a6e62" stroke-width="1.3" rx="12"/>
  <text x="230.0" y="64.2" font-size="12" fill="#7a6e62" text-anchor="middle">Service</text>
  <text x="230.0" y="79.2" font-size="9" fill="#7a6e62" text-anchor="middle">ABC</text>
  <rect x="334" y="48" width="96" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="382.0" y="71.2" font-size="12" fill="#1a1612" text-anchor="middle">Complete</text>
  <rect x="182" y="168" width="96" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="230.0" y="191.2" font-size="12" fill="#1a1612" text-anchor="middle">caller</text>
  <line x1="112.0" y1="59.0" x2="161.6" y2="59.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c26-hollow)"/>
  <line x1="112.0" y1="75.0" x2="165.6" y2="75.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c26-solid)"/>
  <text x="145.0" y="93.0" font-size="10.5" fill="#8b1a1a" text-anchor="middle">holds</text>
  <line x1="332.0" y1="67.0" x2="298.4" y2="67.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c26-hollow)"/>
  <line x1="206.8" y1="166.0" x2="123.2" y2="90.3" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c26-solid)"/>
  <line x1="250.0" y1="166.0" x2="321.4" y2="91.0" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c26-solid)"/>
  <line class="legend" x1="480" y1="60" x2="497.6" y2="60" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c26-solid)"/>
  <text x="518" y="64" font-size="10.5" fill="#7a6e62" text-anchor="start">names a concrete class</text>
  <line class="legend" x1="480" y1="80" x2="497.6" y2="80" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c26-solid)"/>
  <text x="518" y="84" font-size="10.5" fill="#7a6e62" text-anchor="start">names an interface</text>
  <line class="legend" x1="480" y1="100" x2="493.6" y2="100" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c26-hollow)"/>
  <text x="518" y="104" font-size="10.5" fill="#7a6e62" text-anchor="start">inherits its internals</text>
  <rect x="482" y="112" width="26" height="16" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="3"/>
  <text x="518" y="124" font-size="10.5" fill="#7a6e62" text-anchor="start">does not change</text>
</svg>
