<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 236"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>Proxy and Complete both inherit Service, Proxy holds one, and only the caller names either class</title>
  <defs>
    <marker id="c26-solid" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1a1612" stroke="#1a1612" stroke-width="1"/>
    </marker>
    <marker id="c26-hollow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f5f0e8" stroke="#1a1612" stroke-width="1"/>
    </marker>
  </defs>
  <text x="10" y="20" font-size="13" font-weight="bold" font-style="italic" fill="#1a1612" text-anchor="start">Surrogate</text>
  <line x1="10" y1="27" x2="440" y2="27" stroke="#c8bfb0" stroke-width="0.8"/>
  <rect x="20" y="48" width="90" height="38" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="4"/>
  <text x="65.0" y="71.2" font-size="12" font-weight="bold" fill="#1a1612" text-anchor="middle">Proxy</text>
  <rect x="182" y="48" width="96" height="38" fill="none" stroke="#7a6e62" stroke-width="1.3" rx="12"/>
  <text x="230.0" y="64.2" font-size="12" fill="#7a6e62" text-anchor="middle">Service</text>
  <text x="230.0" y="79.2" font-size="9" fill="#7a6e62" text-anchor="middle">ABC</text>
  <rect x="334" y="48" width="96" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="382.0" y="71.2" font-size="12" fill="#1a1612" text-anchor="middle">Complete</text>
  <rect x="182" y="168" width="96" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="230.0" y="191.2" font-size="12" fill="#1a1612" text-anchor="middle">caller</text>
  <line x1="112.0" y1="59.0" x2="178.0" y2="59.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c26-hollow)"/>
  <line x1="112.0" y1="75.0" x2="178.0" y2="75.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c26-solid)"/>
  <text x="145.0" y="93.0" font-size="10.5" fill="#8b1a1a" text-anchor="middle">holds</text>
  <line x1="332.0" y1="67.0" x2="282.0" y2="67.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c26-hollow)"/>
  <line x1="201.1" y1="166.0" x2="96.6" y2="90.0" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c26-solid)"/>
  <line x1="256.6" y1="166.0" x2="352.9" y2="90.0" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c26-solid)"/>
  <text x="10" y="224" font-size="10.5" fill="#7a6e62" text-anchor="start">heavy edges: 2, both in the caller that builds the pair. Proxy names only Service.</text>
  <line x1="480" y1="60" x2="510" y2="60" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c26-solid)"/>
  <text x="518" y="64" font-size="10.5" fill="#7a6e62" text-anchor="start">names a concrete class</text>
  <line x1="480" y1="80" x2="510" y2="80" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c26-solid)"/>
  <text x="518" y="84" font-size="10.5" fill="#7a6e62" text-anchor="start">names an interface</text>
  <line x1="480" y1="100" x2="510" y2="100" stroke="#7a6e62" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#c26-hollow)"/>
  <text x="518" y="104" font-size="10.5" fill="#7a6e62" text-anchor="start">satisfies it</text>
  <line x1="480" y1="120" x2="510" y2="120" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c26-hollow)"/>
  <text x="518" y="124" font-size="10.5" fill="#7a6e62" text-anchor="start">inherits its internals</text>
  <rect x="482" y="132" width="26" height="16" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="3"/>
  <text x="518" y="144" font-size="10.5" fill="#7a6e62" text-anchor="start">kept free of change</text>
</svg>
