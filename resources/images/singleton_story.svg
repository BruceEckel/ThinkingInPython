  <text x="150" y="102" font-size="10" fill="#7a6e62" text-anchor="start">prints</text>
  <text x="150" y="118" font-size="10.5" fill="#8b1a1a" text-anchor="start">config body runs</text>
  <text x="532" y="74" font-size="10.5" fill="#8b1a1a" text-anchor="start">body runs once</text>
  <text x="532" y="106" font-size="10" fill="#7a6e62" text-anchor="start">settings</text>
  <rect x="532" y="112" width="171" height="28" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="617.5" y="130" font-size="10.5" fill="#1a1612" text-anchor="middle">{}</text>
  <rect x="268" y="94" width="72" height="24" fill="none" stroke="#8b1a1a" stroke-width="1.1" rx="3"/>
  <text x="304" y="110" font-size="10.5" fill="#8b1a1a" text-anchor="middle">config</text>
