  <text x="22" y="570" font-size="30" fill="#8b1a1a" font-weight="bold" text-anchor="start">4</text>
  <text x="22" y="592" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">rebind</text>
  <text x="22" y="612" font-size="10.5" fill="#7a6e62" text-anchor="start">a new binding</text>
  <text x="22" y="627" font-size="10.5" fill="#7a6e62" text-anchor="start">moves only your</text>
  <text x="22" y="642" font-size="10.5" fill="#7a6e62" text-anchor="start">name; the module</text>
  <text x="22" y="657" font-size="10.5" fill="#7a6e62" text-anchor="start">keeps its dict</text>
  <path d="M144,540 H346 Q350,540 350,544 V678 Q350,682 346,682 H144 Q140,682 140,678 V544 Q140,540 144,540 Z" fill="none" stroke="#1a1612" stroke-width="1.6"/>
  <text x="150" y="558" font-size="11" fill="#1a1612" font-weight="bold" text-anchor="start">shared_config.py</text>
  <text x="150" y="576" font-size="10.5" fill="#7a6e62" text-anchor="start">settings["theme"] = "dark"</text>
