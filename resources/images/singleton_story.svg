  <text x="150" y="486" font-size="10.5" fill="#8b1a1a" text-anchor="start">{'theme': 'dark'}</text>
  <text x="150" y="502" font-size="10.5" fill="#8b1a1a" text-anchor="start">{'theme': 'dark'}</text>
  <text x="532" y="450" font-size="10" fill="#7a6e62" text-anchor="start">settings</text>
  <rect x="532" y="456" width="171" height="28" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="617.5" y="474" font-size="10.5" fill="#8b1a1a" text-anchor="middle">{'theme': 'dark'}</text>
