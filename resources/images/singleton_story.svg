  <text x="150" y="214" font-size="11" fill="#1a1612" font-weight="bold" text-anchor="start">module_singleton.py</text>
  <text x="150" y="232" font-size="10.5" fill="#1a1612" text-anchor="start">import config</text>
  <text x="150" y="248" font-size="10.5" fill="#8b1a1a" text-anchor="start">import config as again</text>
