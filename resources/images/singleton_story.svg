<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 698"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>Four steps of a module singleton: the first import files config in sys.modules and then runs config.py, a second import gets the same module, a mutation through one name reaches every importer, and rebinding the name leaves config.settings unchanged</title>
  <defs>
    <marker id="ss-ink" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#1a1612" stroke="#1a1612" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
    <marker id="ss-red" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#8b1a1a" stroke="#8b1a1a" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="22" y="54" font-size="30" fill="#8b1a1a" font-weight="bold" text-anchor="start">1</text>
  <text x="22" y="76" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">import</text>
  <text x="22" y="96" font-size="10.5" fill="#7a6e62" text-anchor="start">no entry yet:</text>
  <text x="22" y="111" font-size="10.5" fill="#7a6e62" text-anchor="start">the module is</text>
  <text x="22" y="126" font-size="10.5" fill="#7a6e62" text-anchor="start">filed, then</text>
  <text x="22" y="141" font-size="10.5" fill="#7a6e62" text-anchor="start">config.py runs</text>
  <path d="M144,24 H346 Q350,24 350,28 V162 Q350,166 346,166 H144 Q140,166 140,162 V28 Q140,24 144,24 Z" fill="none" stroke="#1a1612" stroke-width="1.6"/>
  <text x="150" y="42" font-size="11" fill="#1a1612" font-weight="bold" text-anchor="start">module_singleton.py</text>
  <text x="150" y="60" font-size="10.5" fill="#8b1a1a" text-anchor="start">import config</text>
  <path d="M384,32 H476 Q480,32 480,36 V82 Q480,86 476,86 H384 Q380,86 380,82 V36 Q380,32 384,32 Z" fill="none" stroke="#c8bfb0" stroke-width="1.6"/>
  <text x="388" y="47" font-size="11" fill="#7a6e62" text-anchor="start">sys.modules</text>
  <rect x="390" y="54" width="80" height="24" fill="none" stroke="#8b1a1a" stroke-width="1.1" rx="3"/>
  <text x="430" y="70" font-size="10.5" fill="#8b1a1a" text-anchor="middle">'config'</text>
  <path d="M524,24 H711 Q715,24 715,28 V162 Q715,166 711,166 H524 Q520,166 520,162 V28 Q520,24 524,24 Z" fill="none" stroke="#8b1a1a" stroke-width="1.6"/>
