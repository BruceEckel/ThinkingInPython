  <text x="532" y="586" font-size="10" fill="#8b1a1a" text-anchor="start">config.settings: unchanged</text>
  <rect x="532" y="592" width="171" height="28" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="617.5" y="610" font-size="10.5" fill="#1a1612" text-anchor="middle">{'theme': 'dark'}</text>
