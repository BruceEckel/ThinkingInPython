  <text x="22" y="248" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">reuse</text>
  <text x="22" y="268" font-size="10.5" fill="#7a6e62" text-anchor="start">the entry is</text>
  <text x="22" y="283" font-size="10.5" fill="#7a6e62" text-anchor="start">found, so both</text>
  <text x="22" y="298" font-size="10.5" fill="#7a6e62" text-anchor="start">names get the</text>
  <text x="22" y="313" font-size="10.5" fill="#7a6e62" text-anchor="start">same module</text>
