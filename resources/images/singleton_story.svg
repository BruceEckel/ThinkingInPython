  <text x="150" y="274" font-size="10" fill="#7a6e62" text-anchor="start">prints</text>
  <text x="150" y="290" font-size="10.5" fill="#8b1a1a" text-anchor="start">True</text>
  <text x="532" y="246" font-size="10.5" fill="#7a6e62" text-anchor="start">body not run again</text>
  <text x="532" y="278" font-size="10" fill="#7a6e62" text-anchor="start">settings</text>
  <rect x="532" y="284" width="171" height="28" fill="none" stroke="#1a1612" stroke-width="1.1" rx="3"/>
  <text x="617.5" y="302" font-size="10.5" fill="#1a1612" text-anchor="middle">{}</text>
