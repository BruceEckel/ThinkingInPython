  <text x="150" y="386" font-size="11" fill="#1a1612" font-weight="bold" text-anchor="start">shared_config.py</text>
  <text x="150" y="404" font-size="10.5" fill="#1a1612" text-anchor="start">import config</text>
  <text x="150" y="420" font-size="10.5" fill="#1a1612" text-anchor="start">from config import settings</text>
  <text x="150" y="436" font-size="10.5" fill="#8b1a1a" text-anchor="start">settings["theme"] = "dark"</text>
