<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>Two ways greet() gets a name. Embedded call: what a person types goes straight into greet(), which holds the call to input(). Request: greet() holds an Ask, execution goes to a handler that holds the call to input(), and the answer comes back.</title>
  <defs>
    <marker id="ink" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#1a1612" stroke="#1a1612" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
    <marker id="ink_open" viewBox="0 0 18 12" refX="17" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5,1.5 L17,6 L1.5,10.5" fill="none" stroke="#1a1612" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="20" y="24" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">embedded call</text>
  <rect x="20" y="40" width="160" height="84" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="100" y="64" font-size="15" fill="#1a1612" font-weight="bold" text-anchor="middle">greet()</text>
  <rect x="50" y="78" width="100" height="30" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="3"/>
  <text x="100" y="98" font-size="13" fill="#1a1612" text-anchor="middle">input()</text>
  <rect x="540" y="52" width="120" height="60" fill="#eeeeee" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="600" y="79" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="middle">keyboard</text>
  <text x="600" y="97" font-size="10.5" fill="#7a6e62" text-anchor="middle">outside world</text>
  <line x1="540" y1="93" x2="196.4" y2="93" stroke="#1a1612" stroke-width="1.3" marker-end="url(#ink)"/>
  <text x="360" y="83" font-size="12" fill="#1a1612" text-anchor="middle">what a person types</text>

  <text x="20" y="178" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">request</text>
  <rect x="20" y="194" width="160" height="116" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="100" y="218" font-size="15" fill="#1a1612" font-weight="bold" text-anchor="middle">greet()</text>
  <rect x="50" y="238" width="100" height="30" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="3"/>
  <text x="100" y="258" font-size="13" fill="#1a1612" text-anchor="middle">Ask</text>
  <rect x="330" y="194" width="160" height="116" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="410" y="218" font-size="15" fill="#1a1612" font-weight="bold" text-anchor="middle">handler</text>
  <rect x="360" y="238" width="100" height="30" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="3"/>
  <text x="410" y="258" font-size="13" fill="#1a1612" text-anchor="middle">input()</text>
  <rect x="540" y="222" width="120" height="60" fill="#eeeeee" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="600" y="249" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="middle">keyboard</text>
  <text x="600" y="267" font-size="10.5" fill="#7a6e62" text-anchor="middle">outside world</text>
  <line x1="180" y1="226" x2="313.6" y2="226" stroke="#1a1612" stroke-width="1.3" marker-end="url(#ink)"/>
  <text x="255" y="216" font-size="12" fill="#1a1612" text-anchor="middle">request</text>
  <text x="255" y="254" font-size="10.5" fill="#7a6e62" text-anchor="middle">greet() pauses</text>
  <line x1="330" y1="292" x2="184" y2="292" stroke="#1a1612" stroke-width="1.3" marker-end="url(#ink_open)"/>
  <text x="255" y="282" font-size="12" fill="#1a1612" text-anchor="middle">answer</text>
  <line x1="540" y1="253" x2="506.4" y2="253" stroke="#1a1612" stroke-width="1.3" marker-end="url(#ink)"/>
</svg>
