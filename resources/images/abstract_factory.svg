<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 492"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>The same GameEnvironment code run twice: given KittiesAndPuzzles it builds a Kitty and a Puzzle and prints Kitty encounters a Puzzle; given WarriorsAndWeapons it builds a Warrior and a Weapon and prints Warrior battles a Weapon; neither factory builds a Kitty with a Weapon</title>
  <defs>
    <marker id="af-ink" viewBox="0 0 18 12" refX="5" refY="6"
            markerWidth="18" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.5 L17.4,6 L0.5,11.5 L5,6 Z" fill="#1a1612" stroke="#1a1612" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
  </defs>
  <path d="M24,20 H696 Q700,20 700,24 V156 Q700,160 696,160 H24 Q20,160 20,156 V24 Q20,20 24,20 Z" fill="none" stroke="#8b1a1a" stroke-width="1.6"/>
  <text x="40" y="46" font-size="13" fill="#1a1612" font-weight="bold" text-anchor="start">GameEnvironment</text>
  <text x="164.8" y="46" font-size="11" fill="#8b1a1a" text-anchor="start">the same code in both runs</text>
  <text x="40" y="74" font-size="11.5" fill="#1a1612" text-anchor="start">def __init__(self, factory: GameElementFactory) -&gt; None:</text>
  <text x="67.6" y="91" font-size="11.5" fill="#1a1612" text-anchor="start">self.character = factory.make_character()</text>
  <text x="67.6" y="108" font-size="11.5" fill="#1a1612" text-anchor="start">self.obstacle = factory.make_obstacle()</text>
  <text x="40" y="125" font-size="11.5" fill="#1a1612" text-anchor="start">def play(self) -&gt; None:</text>
  <text x="67.6" y="142" font-size="11.5" fill="#1a1612" text-anchor="start">self.character.interact_with(self.obstacle)</text>
  <text x="530" y="91" font-size="11" fill="#8b1a1a" text-anchor="start">names no Kitty,</text>
  <text x="530" y="107" font-size="11" fill="#8b1a1a" text-anchor="start">Puzzle, Warrior,</text>
  <text x="530" y="123" font-size="11" fill="#8b1a1a" text-anchor="start">or Weapon</text>
  <path d="M24,185 H346 Q350,185 350,189 V396 Q350,400 346,400 H24 Q20,400 20,396 V189 Q20,185 24,185 Z" fill="none" stroke="#1a1612" stroke-width="1.6"/>
  <text x="35" y="207" font-size="11" fill="#1a1612" text-anchor="start">g1 = GameEnvironment(KittiesAndPuzzles())</text>
  <rect x="35" y="223" width="175" height="100" fill="none" stroke="#1a1612" stroke-width="1.1" rx="4"/>
  <text x="122.5" y="244" font-size="12" fill="#1a1612" font-weight="bold" text-anchor="middle">KittiesAndPuzzles</text>
  <line x1="35" y1="254" x2="210" y2="254" stroke="#c8bfb0" stroke-width="0.8"/>
  <text x="47" y="274" font-size="11" fill="#7a6e62" text-anchor="start">make_character()</text>
  <rect x="255" y="256" width="80" height="28" fill="none" stroke="#1a1612" stroke-width="1.1" rx="4"/>
  <text x="295" y="275" font-size="12" fill="#1a1612" text-anchor="middle">Kitty</text>
  <line x1="210" y1="270" x2="238.6" y2="270.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#af-ink)"/>
  <text x="47" y="306" font-size="11" fill="#7a6e62" text-anchor="start">make_obstacle()</text>
  <rect x="255" y="288" width="80" height="28" fill="none" stroke="#1a1612" stroke-width="1.1" rx="4"/>
  <text x="295" y="307" font-size="12" fill="#1a1612" text-anchor="middle">Puzzle</text>
  <line x1="210" y1="302" x2="238.6" y2="302.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#af-ink)"/>
  <text x="35" y="353" font-size="11" fill="#7a6e62" text-anchor="start">g1.play() prints</text>
  <text x="35" y="378" font-size="12.5" fill="#1a1612" font-weight="bold" text-anchor="start">Kitty encounters a Puzzle</text>
  <path d="M374,185 H696 Q700,185 700,189 V396 Q700,400 696,400 H374 Q370,400 370,396 V189 Q370,185 374,185 Z" fill="none" stroke="#1a1612" stroke-width="1.6"/>
  <text x="385" y="207" font-size="11" fill="#1a1612" text-anchor="start">g2 = GameEnvironment(WarriorsAndWeapons())</text>
  <rect x="385" y="223" width="175" height="100" fill="none" stroke="#1a1612" stroke-width="1.1" rx="4"/>
  <text x="472.5" y="244" font-size="12" fill="#1a1612" font-weight="bold" text-anchor="middle">WarriorsAndWeapons</text>
  <line x1="385" y1="254" x2="560" y2="254" stroke="#c8bfb0" stroke-width="0.8"/>
  <text x="397" y="274" font-size="11" fill="#7a6e62" text-anchor="start">make_character()</text>
  <rect x="605" y="256" width="80" height="28" fill="none" stroke="#1a1612" stroke-width="1.1" rx="4"/>
  <text x="645" y="275" font-size="12" fill="#1a1612" text-anchor="middle">Warrior</text>
  <line x1="560" y1="270" x2="588.6" y2="270.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#af-ink)"/>
  <text x="397" y="306" font-size="11" fill="#7a6e62" text-anchor="start">make_obstacle()</text>
  <rect x="605" y="288" width="80" height="28" fill="none" stroke="#1a1612" stroke-width="1.1" rx="4"/>
  <text x="645" y="307" font-size="12" fill="#1a1612" text-anchor="middle">Weapon</text>
  <line x1="560" y1="302" x2="588.6" y2="302.0" stroke="#1a1612" stroke-width="1.3" marker-end="url(#af-ink)"/>
  <text x="385" y="353" font-size="11" fill="#7a6e62" text-anchor="start">g2.play() prints</text>
  <text x="385" y="378" font-size="12.5" fill="#1a1612" font-weight="bold" text-anchor="start">Warrior battles a Weapon</text>
  <rect x="250" y="425" width="220" height="30" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4" stroke-dasharray="4,3"/>
  <text x="360" y="445" font-size="12" fill="#7a6e62" text-anchor="middle">Kitty encounters a Weapon</text>
  <path d="M226,434 L238,446 M226,446 L238,434" stroke="#8b1a1a" stroke-width="2" fill="none"/>
  <text x="360" y="478" font-size="11" fill="#8b1a1a" text-anchor="middle">neither factory builds this pair</text>
</svg>
