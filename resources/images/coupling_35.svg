  <line x1="123.1" y1="148.0" x2="166.6" y2="167.0" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c35-solid)"/>
  <path d="M132.0,115.6 Q230.7,124.5 318.9,81.5" fill="none" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c35-solid)"/>
