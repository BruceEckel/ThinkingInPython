<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 236"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>parse_map() names tile(), to_symbol(), and Tile, and tile() is the one place that constructs a Tile</title>
