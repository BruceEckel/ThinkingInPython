<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 236"
     font-family="'JetBrains Mono', Consolas, monospace">
  <title>parse_map() names tile(), to_symbol(), and Tile, and tile() is the one place that constructs a Tile</title>
  <defs>
    <marker id="c35-solid" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1a1612" stroke="#1a1612" stroke-width="1"/>
    </marker>
    <marker id="c35-hollow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f5f0e8" stroke="#1a1612" stroke-width="1"/>
    </marker>
  </defs>
  <text x="10" y="20" font-size="13" font-weight="bold" font-style="italic" fill="#1a1612" text-anchor="start">Flyweight</text>
  <line x1="10" y1="27" x2="440" y2="27" stroke="#c8bfb0" stroke-width="0.8"/>
  <rect x="20" y="108" width="110" height="38" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="4"/>
  <text x="75.0" y="131.2" font-size="12" font-weight="bold" fill="#1a1612" text-anchor="middle">parse_map()</text>
  <rect x="182" y="48" width="90" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="227.0" y="64.2" font-size="12" fill="#1a1612" text-anchor="middle">tile()</text>
  <text x="227.0" y="79.2" font-size="9" fill="#7a6e62" text-anchor="middle">@cache</text>
  <rect x="334" y="48" width="80" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="374.0" y="71.2" font-size="12" fill="#1a1612" text-anchor="middle">Tile</text>
  <rect x="182" y="168" width="100" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="232.0" y="191.2" font-size="12" fill="#1a1612" text-anchor="middle">to_symbol()</text>
  <rect x="334" y="168" width="80" height="38" fill="none" stroke="#c8bfb0" stroke-width="1.3" rx="4"/>
  <text x="374.0" y="191.2" font-size="12" fill="#1a1612" text-anchor="middle">SPECS</text>
  <line x1="128.2" y1="106.0" x2="178.0" y2="86.3" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c35-solid)"/>
  <line x1="129.9" y1="148.0" x2="178.0" y2="166.4" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c35-solid)"/>
  <path d="M132.0,115.6 Q236.9,125.1 330.0,75.8" fill="none" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c35-solid)"/>
  <text x="234.0" y="126.4" font-size="10.5" fill="#8b1a1a" text-anchor="middle">returns</text>
  <line x1="274.0" y1="67.0" x2="330.0" y2="67.0" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c35-solid)"/>
  <text x="302.0" y="57.0" font-size="10.5" fill="#8b1a1a" text-anchor="middle">constructs</text>
  <line x1="252.7" y1="88.0" x2="345.8" y2="164.0" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c35-solid)"/>
  <line x1="284.0" y1="187.0" x2="330.0" y2="187.0" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c35-solid)"/>
  <text x="10" y="224" font-size="10.5" fill="#7a6e62" text-anchor="start">heavy edges: 6, and only tile() constructs, so every caller shares its instances.</text>
  <line x1="480" y1="60" x2="510" y2="60" stroke="#1a1612" stroke-width="2.8" marker-end="url(#c35-solid)"/>
  <text x="518" y="64" font-size="10.5" fill="#7a6e62" text-anchor="start">names a concrete class</text>
  <line x1="480" y1="80" x2="510" y2="80" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c35-solid)"/>
  <text x="518" y="84" font-size="10.5" fill="#7a6e62" text-anchor="start">names an interface</text>
  <line x1="480" y1="100" x2="510" y2="100" stroke="#7a6e62" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#c35-hollow)"/>
  <text x="518" y="104" font-size="10.5" fill="#7a6e62" text-anchor="start">satisfies it</text>
  <line x1="480" y1="120" x2="510" y2="120" stroke="#1a1612" stroke-width="1.3" marker-end="url(#c35-hollow)"/>
  <text x="518" y="124" font-size="10.5" fill="#7a6e62" text-anchor="start">inherits its internals</text>
  <rect x="482" y="132" width="26" height="16" fill="none" stroke="#8b1a1a" stroke-width="1.6" rx="3"/>
  <text x="518" y="144" font-size="10.5" fill="#7a6e62" text-anchor="start">kept free of change</text>
</svg>
