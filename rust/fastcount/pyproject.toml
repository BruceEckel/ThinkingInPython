[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "fastcount"
requires-python = ">=3.15"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

# What `uv sync` watches to decide the crate needs a rebuild. uv's
# default is pyproject.toml alone, so an edit to the Rust source or to
# the type stub left the installed package as it was.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "fastcount.pyi" },
]
